/* ---------- drawing ---------- */
const TS=()=>1/Math.pow(S?S.z:1,1.5);
const fpx=n=>Math.max(2,Math.min(30,Math.round(Math.min(n*TS(),16/(S?S.z:1))*10)/10));
// icons (flags, anchors, ships) never go below about 10 screen pixels
const ipx=n=>Math.min(80/(S?S.z:1),Math.max(50/(S?S.z:1),5*n*TS()));
const CFL={PART:'🏴',EC:'🇪🇨',CO:'🇨🇴',VE:'🇻🇪',UK:'🇬🇧',PE:'🇵🇪',BO:'🇧🇴',PY:'🇵🇾',UY:'🇺🇾',CL:'🇨🇱',AR:'🇦🇷',BR:'🇧🇷',CM:'🏳️',MX:'🇲🇽',US:'🇺🇸',RBA:'🇦🇷',SLP:'🇦🇷'};
const ICON=['🪖','🪖⭐','🚛','🛡️'];
function cardsHTML(v){
  const cs=v.map((x,t)=>x?`<div class="card"><div class="ico">${ICON[t]}</div><b>${x}</b><div class="mut">${NM[t]}</div></div>`:'').join('');
  return cs?`<div class="cards">${cs}</div>`:'';
}
// connected pieces of one country's current territory (main body and enclaves), largest first
function compsOf(c){
  const seen=new Set(),out=[];
  P.forEach(p=>{
    if(S.ctl[p.id]!==c||seen.has(p.id))return;
    const comp=[p.id];seen.add(p.id);
    for(let k=0;k<comp.length;k++)P[comp[k]].adj.forEach(b=>{if(S.ctl[b]===c&&!seen.has(b)){seen.add(b);comp.push(b)}});
    out.push(comp);
  });
  return out.sort((a,b)=>b.length-a.length);
}
// one name for one piece: rotated along the piece's long axis, stretched to its length
function drawNameFor(c,comp){
  const pts=comp.map(i=>[P[i].x,P[i].y]),n=pts.length;
  const mx=pts.reduce((a,q)=>a+q[0],0)/n,my=pts.reduce((a,q)=>a+q[1],0)/n;
  let sxx=0,syy=0,sxy=0;
  pts.forEach(([x,y])=>{const dx=x-mx,dy=y-my;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy});
  let ang=0.5*Math.atan2(2*sxy,sxx-syy);
  if(ang>Math.PI/2)ang-=Math.PI;if(ang<-Math.PI/2)ang+=Math.PI;
  const ca=Math.cos(ang),sa=Math.sin(ang);
  let u0=1e9,u1=-1e9,v0=1e9,v1=-1e9;
  pts.forEach(([x,y])=>{const dx=x-mx,dy=y-my,u=dx*ca+dy*sa,v=-dx*sa+dy*ca;if(u<u0)u0=u;if(u>u1)u1=u;if(v<v0)v0=v;if(v>v1)v1=v});
  const len=Math.max(u1-u0+K*2,K*3),thick=Math.max(v1-v0+K*2,K*1.5);
  const size=Math.min(30,Math.max(7,thick*0.55))*TS();
  ctx.save();ctx.translate(mx,my);ctx.rotate(ang);
  ctx.font=`800 ${size}px Spectral,Georgia,serif`;
  const w=ctx.measureText(CN[c].n).width||1;
  ctx.scale(Math.max(.35,Math.min(3,len*0.92/w)),1);
  ctx.strokeText(CN[c].n,0,0);ctx.fillStyle='#fff';ctx.fillText(CN[c].n,0,0);
  ctx.restore();
}
// recalculated on every draw, so the name follows the country's current shape
function drawLabels(){
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='rgba(7,18,26,.9)';
  CK.forEach(c=>{if(!S.act[c])return;compsOf(c).forEach(comp=>drawNameFor(c,comp))});
}
const ctx=$('#cv').getContext('2d');
const teamHue=t=>{const i=parseInt(t);if(!isNaN(i))return ALC[i];if(CI[t]!==undefined)return (CI[t]*37)%360;return 280};
function col(p){
  const c=S?S.ctl[p.id]:null;
  if(c==='PART')return '#f2f2f2';
  if(c===null||c===undefined)return 'hsl(205 10% 24%)';
  const Lg=32+(CI[c]%4)*3,hue=teamHue(S.team[c])+((CI[c]%3)-1)*9;
  return `hsl(${hue} 45% ${Lg}%)`;
}
function draw(){
  ctx.setTransform(SS,0,0,SS,0,0);ctx.fillStyle='#0b1822';ctx.fillRect(0,0,W,H);
  const cl=P.map(p=>col(p));
  for(let i=0;i<cell.length;i++){const a=cell[i];if(a===-2){ctx.fillStyle='#1f5f8b';ctx.fillRect((i%GW)*CS,(i/GW|0)*CS,CS,CS);continue}if(a<0)continue;ctx.fillStyle=cl[a];ctx.fillRect((i%GW)*CS,(i/GW|0)*CS,CS,CS)}
  // sea zone borders
  for(let i=0;i<cell.length;i++){
    if(cell[i]!==-1)continue;
    const x=i%GW,y=i/GW|0;
    ctx.fillStyle='rgba(60,170,180,.85)';
    if(x<GW-1&&cell[i+1]===-1&&SEA[i+1]!==SEA[i])ctx.fillRect((x+1)*CS-.5,y*CS,1,CS);
    if(y<GH-1&&cell[i+GW]===-1&&SEA[i+GW]!==SEA[i])ctx.fillRect(x*CS,(y+1)*CS-.5,CS,1);
  }
  for(let i=0;i<cell.length;i++){
    const x=i%GW,y=i/GW|0,a=cell[i];
    for(const [j,v] of [[x<GW-1?i+1:-1,0],[i+GW<cell.length?i+GW:-1,1]]){
      if(j<0)continue;const b=cell[j];if(a===b)continue;
      const strong=a<0||b<0||P[a].c!==P[b].c||(S&&S.ctl[a]!==S.ctl[b]);
      ctx.fillStyle=(a>=0&&b>=0&&mtnEdge(a,b))?'#9a6a35':strong?'rgba(5,15,22,.95)':'rgba(5,15,22,.45)';
      const w=strong?2:1;
      if(v===0)ctx.fillRect((x+1)*CS-w/2,y*CS,w,CS);else ctx.fillRect(x*CS,(y+1)*CS-w/2,CS,w);
    }
  }
  if(!S)return;
  const hl=(ids,color)=>{ctx.fillStyle=color;ids.forEach(i=>P[i].cells.forEach(c=>ctx.fillRect((c%GW)*CS,(c/GW|0)*CS,CS,CS)))};
  if(S.grp.length){
    const targets=[...new Set(S.grp.flatMap(s=>P[s].adj))].filter(b=>!isMy(S.ctl[b])&&!(S.ctl[b]!==null&&S.team[S.ctl[b]]===S.team[S.pl]));
    hl(targets,'rgba(240,195,90,.22)');
    hl(S.grp,'rgba(255,255,255,.3)');
  }
  if(S.pending.length){const e=S.pending[0];P.forEach(p=>{if(p.c===e.c&&e.asg[p.id]!==undefined&&S.ctl[p.id]===e.c){hl([p.id],'rgba(255,255,255,.22)');outlineProv(p)}})}
  ctx.font=`800 ${fpx(14)}px Spectral,Georgia,serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=fpx(3);ctx.strokeStyle='#07121a';
  P.forEach(p=>{
    const c=S.ctl[p.id];if(c===null)return;
    const reb=S.reb[p.id]>0;
    const seen=vis(p.id),n=tot(S.u[p.id]);
    const txt=reb?'!':(PLUS&&S.z<2?'':(seen?(n?String(n):''):'?'));
    if(seen&&!reb&&n&&!(PLUS&&S.z<2)){ctx.font=`${ipx(12)}px sans-serif`;ctx.fillText(CFL[c]||'🏴',p.x,p.y-12);ctx.font='800 14px Spectral,Georgia,serif'}
    ctx.globalAlpha=(isMy(c)&&mov(p.id)===0)?.65:1;
    ctx.strokeText(txt,p.x,p.y);ctx.fillStyle=reb?'#ff7b72':c==='PART'?'#111':'#fff';ctx.fillText(txt,p.x,p.y);
    if(false){ctx.font=`600 ${fpx(9)}px "Public Sans",sans-serif`;ctx.strokeText(p.name,p.x,p.y+12);ctx.fillStyle=c==='PART'?'#111':'#fff';ctx.fillText(p.name,p.x,p.y+12);ctx.font='800 14px Spectral,Georgia,serif'}
  });
  ctx.globalAlpha=1;
  P.forEach(p=>{if(!p.fac)return;ctx.fillStyle='#f0c35a';ctx.strokeStyle='#07121a';ctx.lineWidth=2;ctx.fillRect(p.x+4,p.y+4,7,7);ctx.strokeRect(p.x+4,p.y+4,7,7)});
  ctx.textAlign='center';ctx.textBaseline='middle';
  SEAZ.forEach(z=>{const f=S.zf[z.id];if(!f)return;ctx.font=`${ipx(11)}px sans-serif`;ctx.fillStyle=isMy(f.c)?'#8fe0c8':'#f08a80';ctx.fillText(shipsTxt(f.n),z.x,z.y+10)});
  P.forEach(p=>{if(!p.yard)return;ctx.font=`${ipx(12)}px sans-serif`;ctx.fillStyle='#8fd3ff';ctx.fillText('⚓',p.x-13,p.y+12)});
  if(S.z<0.8){ctx.globalAlpha=.9;drawLabels();drawSeaNames();ctx.globalAlpha=1}
  // orders: thick arrows, blue = move, red = attack
  ctx.lineCap='round';
  S.plans.forEach(q=>{
    const A=P[q.a],B=P[q.b],col=q.t==='a'?'#ff4d4d':'#4aa3ff';
    const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
    const sx=A.x+ux*9,sy=A.y+uy*9,ex=B.x-ux*16,ey=B.y-uy*16;
    ctx.strokeStyle='#07121a';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.strokeStyle=col;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
    const tipX=B.x-ux*4,tipY=B.y-uy*4,bx=tipX-ux*16,by=tipY-uy*16,px2=-uy*9,py2=ux*9;
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.lineTo(bx+px2,by+py2);ctx.lineTo(bx-px2,by-py2);ctx.closePath();ctx.fill();
    const mx=(sx+ex)/2,my=(sy+ey)/2;
    ctx.font=`800 ${fpx(12)}px "Public Sans",sans-serif`;ctx.strokeStyle='#07121a';ctx.lineWidth=3;
    ctx.strokeText(String(tot(q.v)),mx,my);ctx.fillStyle='#fff';ctx.fillText(String(tot(q.v)),mx,my);
  });
}

function showVictory(){S.screen='victory';S.starOn=false;render()}
function victoryHTML(){
  return `<h2>Миссия выполнена!</h2><div class="mut">Все враги капитулировали на ходу ${S.t+1}. Можно продолжить и играть дальше.</div><div class="row"><button onclick="S.screen='main';render()">Продолжить игру</button><button class="g" onclick="setup()">Новая игра</button></div>`+logHTML();
}

/* ---------- panel ---------- */
function logHTML(){
  const st=CK.filter(c=>S.act[c]).map(c=>`${CN[c].n}: ${S.out[c]&&S.master[c]===undefined?'сдалась':S.master[c]!==undefined?'марионетка':(c==='PY'?'армия '+armyCount(c):lostOf(c)+'/'+Math.ceil(P.filter(p=>p.c===c).length*ideoV(c,'morale',0.5)))}`).join('; ');
  return `<div class="lg">${S.spec?'':`<div>Население ${POP[S.pl]} тыс., мобилизовано ${Math.round(mobPct(S.pl))}%</div>`}<div>${st}</div></div><div class="lg">${S.log.slice(0,3).map(x=>`<div>${x}</div>`).join('')}</div>`;
}
function panel(){
  if(S.over)return `<div class="ban">${S.over==='win'?'Победа':'Поражение'}</div><div class="mut">${S.log[0]||''} Ход ${S.t+1}.</div><div class="row"><button onclick="setup()">Новая игра</button></div>`+logHTML();
  if(S.events&&S.events.length)return eventHTML();
  if(S.pending.length)return dlgHTML();
  if(S.screen==='victory')return victoryHTML();
  if(S.screen==='diplo')return diploHTML();
  if(S.screen==='state')return stateHTML();
  if(S.fsel!==null)return seaPanel();
  if(S.screen==='puppets')return puppetHTML();
  let h='';
  if(S.plans.length){
    h+=`<h2>Приказы: ${S.plans.length}</h2>`;
    S.plans.forEach((q,i)=>{h+=`<div class="row"><span style="color:${q.t==='a'?'#ff7b72':'#7fbfff'}">●</span><span>${P[q.a].name} → ${P[q.b].name}: ${q.t==='a'?'атака':'переброска'}, ${tot(q.v)} див. (${comp(q.v)})</span><button class="g z" onclick="delPlan(${i})">×</button></div>`});
  }
  if(S.grp.length){
    h+=`<h2 style="margin-top:10px">Выбрано: ${S.grp.map(s=>P[s].name).join(', ')}</h2><div class="mut">Выбери число дивизий и нажми провинцию-цель: синяя стрелка — переброска, красная — атака.</div>`;
    S.grp.forEach(s=>{
      const av=avail(s);
      h+=`<div class="mut" style="margin-top:6px"><b>${P[s].name}</b> (доступно ${tot(av)})</div>`;
      [0,1,2,3].forEach(t=>{if(av[t]>0)h+=`<div class="row"><span style="min-width:150px">${NM[t]} <b id="c${s}_${t}">${S.cnt[s][t]}</b>/${av[t]}</span><input type="range" min="0" max="${av[t]}" value="${S.cnt[s][t]}" oninput="setCnt(${s},${t},this)" onchange="render()"></div>`});
    });
  }
  h+=`<div class="row"><button class="g" onclick="toggleMode()">Несколько источников: ${S.mode==='src'?'вкл':'выкл'}</button></div>`;
  if(S.mode==='src')h+='<div class="mut">Выбирай несколько своих провинций, потом нажми одну вражескую рядом: из каждой пойдёт своя стрелка.</div>';
  const f=S.focus;
  if(f!==null){
    const c=S.ctl[f],who=c==='PART'?'партизаны':c===null?'нейтральная':isMy(c)?'твоя':S.team[c]===S.team[S.pl]?'союзная':'вражеская';
    h+=`<h2 style="margin-top:10px">${P[f].name}</h2><div class="mut">${CN[P[f].c].n}, ${who}. Доход провинции: ${P[f].inc}.`;
    if(c!==null){
      h+=vis(f)?` Дивизий ${tot(S.u[f])} из 12.`:' Войска неизвестны.';
      if(vis(f))h+=cardsHTML(S.u[f]);
      if(isMy(c)&&tot(S.q[f]))h+=` В пути: ${comp(S.q[f])}.`;
      if(S.reb[f])h+=' <span class="red">⚠ Восстание! Подави его до следующего хода, иначе там появятся партизаны.</span>';
    }
    h+='</div>';
    if(c!==null&&isMy(c)){
      h+=(P[f].fac?'<div class="mut">🏭 Завод здесь: можно заказывать войска.</div>':'<div class="mut">Завода здесь нет: войска не заказать.</div>')+`<div class="row">`+[0,1,2,3].map(t=>`<button class="g" onclick="rec(${t})" ${S.G[c]<CT[t]||free(f)<=0||!P[f].fac?'disabled':''}>${NM[t]}: ${CT[t]} (сила ${PW[t]})</button>`).join('')+`</div>`;
    }
  }else if(!S.grp.length&&!S.plans.length){
    h+='<div class="mut">Нажми свою провинцию, потом соседнюю: появится стрелка. Синяя — переброска, красная — атака. Несколько стрелок собери через «Несколько источников». Кнопка «!» отдаёт приказы, «X» очищает их. Войска заказываются только в провинциях с заводом (золотой квадрат на карте).</div>';
  }
  return h+logHTML();
}
function renderFab(){
  const hasP=S.plans.length>0,blocked=S.over||S.pending.length;
  const myTurn=!MP||MP.active===ME;
  let timer='';
  if(MP&&MP.active&&MP.active!=='bots'){
    const left=Math.max(0,Math.ceil(((MP.deadline||0)-Date.now())/1000));
    const who=Object.keys(S.humanOwner||{}).find(k=>S.humanOwner[k]===MP.active);
    const whoName=who?CN[who].n:'';
    timer=`<div class="mut">${MP.active===ME?'твой ход':'ход: '+(whoName||'игрок')} · ${left}с</div>`;
  }
  if(MP)timer=`<div class="mut">я: ${CN[S.pl]?CN[S.pl].n:S.pl} · ${(ME||'').slice(-4)}</div>`+timer;
  $('#fab').innerHTML=timer
    +(hasP&&myTurn?`<button class="g" onclick="clearPlans()" title="Очистить приказы">X</button>`:'')
    +`<div class="col">${hasP&&myTurn?`<button onclick="execPlans()" title="Отдать приказы">!</button>`:''}${myTurn?`<button class="g" onclick="endTurn()" ${blocked?'disabled':''} title="Закончить ход">!!</button>`:''}</div>`;
}

function render(){
  if(!S)return;
  S.plans=S.plans.filter(q=>isMy(S.ctl[q.a])&&P[q.a].adj.includes(q.b));
  S.grp=S.grp.filter(s=>isMy(S.ctl[s]));
  const dm=S.t-PEACE,yr=1864+Math.floor(dm/12),mo=MO[((dm%12)+12)%12];
  const pup=CK.some(c=>S.master[c]===S.pl);
  $('#hd').innerHTML=`<span class="date">${mo} ${yr}</span>${S.t<PEACE?`<span class="mut">мир · до войны ${PEACE-S.t} мес.</span>`:''}${S.t>=PEACE&&!S.spec?`<button class="${S.mob[S.pl]?'':'g'} z" onclick="toggleMob()">Мобилизация: ${mobPct(S.pl)>=mobCap(S.pl)?'исчерпано':S.mob[S.pl]?'вкл':'выкл'} (${Math.round(mobPct(S.pl))}%)</button>`:''}${S.spec?'<span class="mut">Наблюдение</span>':`<span class="gold">Казна ${S.G[S.pl]} (+${incomeOf(S.pl)})</span>`}${pup?`<button class="g z" onclick="S.screen=S.screen==='puppets'?'main':'puppets';render()">Мои марионетки</button>`:''}${S.spec?'':'<button class="g z" onclick="openState()">Государство</button>'}${S.spec?'<button class="g z" onclick="setup()">Новая игра</button>':'<button class="g z" onclick="openDiplo()">Дипломатия</button>'}<button class="g z" onclick="toggleSound()">${SFX_ON?'Звук: вкл':'Звук: выкл'}</button><button class="g z" onclick="reportSize()">Размер</button><button class="g z" onclick="surrender()">Сдаться</button><button class="g z" onclick="zoom(.8)" aria-label="Уменьшить">−</button><button class="g z" onclick="zoom(1.25)" aria-label="Увеличить">+</button>`;
  $('#cv').style.width=(S.z*100)+'%';
  draw();
  renderFab();
  $('#pn').innerHTML=dipBanner()+panel();
  drawPreview();
}

build();nameProvinces();applyScenario();draw();lobby();
