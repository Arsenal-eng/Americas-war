<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Америка, 1864: альянсы</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--sea:#0b1822;--pn:#14293a;--ink:#e6edf1;--mut:#8da3b2;--gold:#f0c35a;--red:#ff7b72;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--sea);color:var(--ink);font:14px/1.4 "Public Sans",system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
header{background:var(--pn);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1,h2{font-family:Spectral,Georgia,serif;margin:0}
.date{font:800 18px Spectral,Georgia,serif;flex:1}
.gold{color:var(--gold);font-weight:600}
button{font:600 14px "Public Sans",sans-serif;border:0;border-radius:8px;padding:10px 14px;background:var(--gold);color:#1a1405;cursor:pointer}
button.g{background:#26435a;color:var(--ink)}
button.z{padding:8px 12px}
button:disabled{opacity:.4}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;overflow:auto}
canvas{display:block}
#fab{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;align-items:flex-end;z-index:5}
#fab .col{display:flex;flex-direction:column;gap:6px}
#fab button{min-width:52px;font-size:18px;font-weight:800}
#pn{background:var(--pn);padding:10px 12px;min-height:140px;max-height:42%;overflow:auto}
#pn h2{font-size:17px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}

</style></head><body>
<div id="app"><header id="hd"></header><div id="mapwrap"><main id="map"><canvas id="cv" width="1760" height="2032"></canvas></main><div id="fab"></div></div><section id="pn"></section></div>
<div id="ov"></div>
<script>
const $=s=>document.querySelector(s);
const K=8,CS=4,W=110*K,H=127*K,GW=Math.ceil(W/CS),GH=Math.ceil(H/CS),SS=2;
const px=o=>(o+125)*K,py=a=>(62-a)*K;
const CN={EC:{n:"Эквадор",k:5,p:1,g:1},CO:{n:"Колумбия",k:10,p:2,g:1},VE:{n:"Венесуэла",k:9,p:2,g:1},UK:{n:"Великобритания",k:17,p:3,g:3},PE:{n:"Перу",k:8,p:2,g:1},BO:{n:"Боливия",k:7,p:2,g:1},PY:{n:"Парагвай",k:5,p:5,g:2},UY:{n:"Уругвай",k:4,p:2,g:2},CL:{n:"Чили",k:8,p:2,g:2},AR:{n:"Аргентина",k:14,p:2,g:2},BR:{n:"Бразилия",k:19,p:2,g:2},CM:{n:"Центр. Америка",k:4,p:1,g:1},MX:{n:"Мексика",k:11,p:2,g:2},US:{n:"США",k:16,p:3,g:3}};
CN.RBA={n:"Республика Буэнос-Айрес",k:5,p:3,g:2};CN.SLP={n:"Соед. Штаты Ла-Платы",k:9,p:1,g:2};
CN.UN={n:"Союз (Север)",k:10,p:3,g:3};CN.CS={n:"Конфедерация",k:6,p:2,g:2};
const CN0=JSON.parse(JSON.stringify(CN));
let SCEN=1;
const CK=Object.keys(CN),CI={};CK.forEach((c,i)=>CI[c]=i);
const NM=["Пехота","Элитная пехота","Мотопехота","Танки"],PW=[1,2,4,8],CT=[3,9,15,18];
const ALN=['А','Б','В','Г','Д'],ALC=[168,4,215,38,110];
const MO=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const R=[
["EC",5,"-80,1 -78,1 -75,0 -75,-2 -78,-4 -81,-4 -81,-2"],
["CO",10,"-78,7 -77,9 -72,12 -71,10 -72,7 -67,6 -67,2 -70,-4 -73,-3 -75,0 -78,1 -78,4"],
["VE",9,"-72,12 -68,12 -62,11 -61,8 -60,5 -64,2 -67,2 -67,6 -72,7 -71,10"],
["UK",3,"-61,8 -57,7 -57,2 -60,2 -60,5","Гайана"],
["PE",8,"-81,-4 -78,-4 -75,-2 -73,-3 -70,-4 -70,-10 -69,-13 -69,-17 -70,-18 -76,-14 -81,-6"],
["BO",7,"-70,-10 -69,-11 -65,-11 -62,-14 -58,-17 -58,-20 -62,-22 -65,-22 -68,-22 -69,-20 -70,-18 -69,-17 -69,-13"],
["PY",5,"-58,-20 -62,-22 -62,-24 -58,-27 -55,-27 -54,-26 -54,-24 -58,-22"],
["UY",4,"-58,-30 -53,-33 -54,-35 -57,-35 -58,-34"],
["CL",8,"-70,-18 -68,-22 -69,-28 -70,-33 -71,-37 -72,-42 -72,-50 -72,-54 -75,-52 -74,-45 -73,-38 -71.5,-30 -70.5,-24 -70.5,-19"],
["AR",14,"-68,-22 -62,-22 -62,-24 -58,-27 -57,-28 -58,-30 -58,-34 -57,-35 -58,-37 -62,-39 -65,-42 -66,-47 -69,-51 -68,-55 -72,-54 -72,-50 -72,-42 -71,-37 -70,-33 -69,-28"],
["BR",19,"-60,5 -60,2 -57,2 -52,4 -50,0 -45,-2 -39,-4 -35,-6 -35,-9 -39,-14 -39,-18 -41,-22 -44,-23 -48,-26 -48,-29 -53,-33 -58,-30 -57,-28 -54,-26 -54,-24 -58,-22 -58,-17 -62,-14 -65,-11 -69,-11 -70,-10 -70,-4 -67,2 -64,2"],
["CM",4,"-92,15 -91,17 -88,18 -84,15 -83,11 -77,9 -78,7 -81,8 -86,11 -91,13"],
["MX",11,"-117,32 -111,31 -106,32 -104,29 -100,29 -97,26 -97,22 -95,19 -91,19 -90,21 -87,21 -88,18 -91,17 -92,15 -95,16 -100,17 -105,20 -106,24 -110,27 -115,30"],
["US",16,"-125,49 -95,49 -89,48 -83,46 -79,43 -75,45 -67,45 -70,41 -76,37 -81,32 -80,26 -83,29 -90,30 -97,26 -100,29 -104,29 -106,32 -111,31 -117,32 -121,35 -124,40"],
["UK",14,"-125,49 -95,49 -89,48 -83,46 -79,43 -75,45 -67,45 -60,47 -55,50 -60,56 -66,60 -75,62 -125,62","Канада"],
["UK",1,"-59.2,-51.2 -57.8,-51.8 -58.2,-52.3 -59.8,-52.0 -59.3,-51.5","Фолкленды"],
["UK",1,"-61.3,-51.3 -60.6,-51.2 -60.2,-51.8 -60.9,-52.2 -61.5,-51.8","Фолкленды"]];

const cell=new Int16Array(GW*GH).fill(-1),P=[];
let PEACE=10;
let FFA=false;
let PLUS=false;
let BOTDECIDE=false;
let NOCLIP=false;
let INFMONEY=false;
let ZERO=false;
// noclip: every division of the player is worth 999 in battle
const strengthOwn=(v,owner)=>(NOCLIP&&isMy(owner))?999*tot(v):pw(v)*(isMy(owner)?ideoV(owner,'atk',1):1);
let S=null,SEL={},SELPL=null;
const tot=v=>v[0]+v[1]+v[2]+v[3],pw=v=>v[0]+2*v[1]+4*v[2]+8*v[3],Z=()=>[0,0,0,0];
const clamp10=v=>{const r=v.slice();while(tot(r)>12){const t=r.findIndex(x=>x>0);r[t]--}return r};
const clampRoom=(v,room)=>{const r=Z();let left=room;for(let t=0;t<4;t++){const take=Math.max(0,Math.min(v[t],left));r[t]=take;left-=take}return r};

function inside(pl,x,y){let c=false;for(let i=0,j=pl.length-1;i<pl.length;j=i++){const[a,b]=pl[i],[d,e]=pl[j];if((b>y)!==(e>y)&&x<(d-a)*(y-b)/(e-b)+a)c=!c}return c}
function build(){
  R.forEach(([c,n0,ps,lb],ri)=>{
    const n=n0*(PLUS?4:1);
    const pl=ps.split(' ').map(q=>{const[a,b]=q.split(',');return[px(+a),py(+b)]});
    const cs=[];for(let i=0;i<cell.length;i++)if(cell[i]<0&&inside(pl,(i%GW+.5)*CS,((i/GW|0)+.5)*CS))cs.push(i);
    let s=ri*97+13;const rnd=()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
    const xy=i=>[i%GW,i/GW|0];
    let sd=[xy(cs[rnd()*cs.length|0])];
    while(sd.length<n){let bi=cs[0],bd=-1;for(const i of cs){const[x,y]=xy(i);let d=1e9;for(const q of sd)d=Math.min(d,(x-q[0])**2+(y-q[1])**2);if(d>bd){bd=d;bi=i}}sd.push(xy(bi))}
    let as;
    const asg=()=>{as=cs.map(i=>{const[x,y]=xy(i);let b=0,bd=1e9;sd.forEach((q,k)=>{const d=(x-q[0])**2+(y-q[1])**2;if(d<bd){bd=d;b=k}});return b})};
    for(let it=0;it<4;it++){asg();const sm=sd.map(()=>[0,0,0]);cs.forEach((i,j)=>{const[x,y]=xy(i),m=sm[as[j]];m[0]+=x;m[1]+=y;m[2]++});sd=sd.map((q,k)=>sm[k][2]?[sm[k][0]/sm[k][2],sm[k][1]/sm[k][2]]:q)}
    asg();
    const base=P.length;
    for(let k=0;k<n;k++)P.push({id:base+k,c,c0:c,lbl:lb||CN[c].n,k:k+1,k0:k+1,name:`${lb||CN[c].n} ${k+1}`,cells:[],adj:[],x:0,y:0,inc:1});
    cs.forEach((i,j)=>{cell[i]=base+as[j];P[base+as[j]].cells.push(i)});
  });
  LAKES.forEach(poly=>{
    const pl=poly.map(([lo,la])=>[px(lo),py(la)]);
    for(let i=0;i<cell.length;i++){
      if(!inside(pl,(i%GW+.5)*CS,((i/GW|0)+.5)*CS))continue;
      const a=cell[i];if(a>=0)P[a].cells=P[a].cells.filter(x=>x!==i);
      cell[i]=-2;
    }
  });
  P.forEach(p=>{
    if(!p.cells.length)return;
    let sx=0,sy=0;p.cells.forEach(i=>{sx+=i%GW;sy+=i/GW|0});sx/=p.cells.length;sy/=p.cells.length;
    let bi=p.cells[0],bd=1e9;p.cells.forEach(i=>{const d=(i%GW-sx)**2+((i/GW|0)-sy)**2;if(d<bd){bd=d;bi=i}});
    p.x=(bi%GW+.5)*CS;p.y=((bi/GW|0)+.5)*CS;
  });
  const ad=P.map(()=>new Set());
  for(let i=0;i<cell.length;i++){const a=cell[i];if(a<0)continue;
    const r=i%GW<GW-1?cell[i+1]:-1,d=i+GW<cell.length?cell[i+GW]:-1;
    [r,d].forEach(b=>{if(b>=0&&b!==a){ad[a].add(b);ad[b].add(a)}});}
  P.forEach((p,i)=>p.adj=[...ad[i]]);
  assignYards();
  buildSea();
  P.forEach(p=>{p.inc=Math.max(1,Math.round(CN[p.c].g*(.5+((p.id*2654435761>>>0)%1000)/1000)))});
}

/* ---------- population, contacts, kills, bot decisions ---------- */
// population in thousands (1864, rough)
const POP={PY:400,UY:230,AR:1200,BR:9000,CL:1200,PE:2600,BO:1700,EC:1000,CO:2000,VE:1600,CM:2000,MX:8000,US:31000,UK:26000,RBA:500,SLP:700,UN:22000,CS:9000};
function trackContact(){
  P.forEach(p=>{if(S.ctl[p.id]!==S.pl)return;p.adj.forEach(b=>{const c=S.ctl[b];if(c!==null&&rel(S.pl,c)==='war')S.touch[c]=true})});
}
// the player leaves a capitulated enemy's fate to the bots if he never bordered it
// and did fewer kills and fewer captures than every other participant against it
function shouldBotDecide(c){
  if(S.touch[c])return false;
  const others=CK.filter(a=>a!==S.pl&&a!==c&&(gv(S.kills,a,c)+gv(S.caps,a,c))>0);
  if(!others.length)return false;
  const mk=gv(S.kills,S.pl,c),mc=gv(S.caps,S.pl,c);
  return others.every(a=>mk<gv(S.kills,a,c)&&mc<gv(S.caps,a,c));
}
// bots' decision: every province goes to the neighbouring country that holds most of its border, else neutral
function botResolve(c){
  P.forEach(p=>{
    if(p.c!==c||S.ctl[p.id]!==c)return;
    const cnt={};
    p.adj.forEach(b=>{const o=S.ctl[b];if(o!==null&&o!==c&&CK.includes(o)&&S.act[o]&&!S.out[o])cnt[o]=(cnt[o]||0)+1});
    const best=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0];
    if(best){S.ctl[p.id]=best;S.annex[p.id]=true;S.from[p.id]=c;S.m[p.id]=Z()}
    else{S.ctl[p.id]=null;S.u[p.id]=Z();S.m[p.id]=Z();S.q[p.id]=Z();S.annex[p.id]=false;S.reb[p.id]=0}
  });
}

/* ---------- diplomacy ---------- */
const pairKey=(a,b)=>[a,b].sort().join('|');
// relation between two countries: ally, war (default), truce, peace; neutral if not in play
function rel(a,b){
  if(a===b||a==null||b==null)return 'self';
  if(S.team[a]===undefined||S.team[b]===undefined)return 'neutral';
  if(S.team[a]===S.team[b])return 'ally';
  return S.rel[pairKey(a,b)]||(S.zero?'peace':'war');
}
// a garrison this strong cannot be shaken by partisans
const strong=pid=>S.u[pid][0]>=4||S.u[pid][1]>=2||S.u[pid][2]>=1||S.u[pid][3]>=1;
const strengthOf=c=>P.reduce((x,p)=>x+(S.ctl[p.id]===c?pw(S.u[p.id]):0),0);
const teamPow=t=>CK.filter(c=>S.act[c]&&!S.out[c]&&S.team[c]===t).reduce((x,c)=>x+strengthOf(c),0);
const chanceOf=(mine,theirs)=>Math.round(100*Math.max(.05,Math.min(.9,.15+.7*mine/(mine+theirs+1e-9))))+ideoV(S.pl,'dip',0);
const roll=pct=>Math.random()*100<pct;
function syncPuppets(){CK.forEach(c=>{if(S.master[c]===S.pl)S.team[c]=S.team[S.pl]})}
function breakAlliance(){
  const old=S.team[S.pl];
  CK.forEach(a=>{if(a!==S.pl&&S.master[a]===undefined&&S.act[a]&&!S.out[a]&&S.team[a]===old)S.rel[pairKey(S.pl,a)]='peace'});
  S.team[S.pl]='solo'+S.pl;
  syncPuppets();
}
function expireTruces(){
  Object.keys(S.truceEnd).forEach(k=>{
    if(S.t>=S.truceEnd[k]){
      delete S.truceEnd[k];S.rel[k]='war';
      const[a,b]=k.split('|');L(`Перемирие ${CN[a].n} и ${CN[b].n} закончилось.`);
    }
  });
}
// cooldowns: any action with a country once per 2 turns, proposals (peace, truce, invitation, alliance) once per 4 turns
const cdLeft=(key,gap)=>Math.max(0,gap-(S.t-(S.cool[key]===undefined?-99:S.cool[key])));
const dipMark=key=>{S.cool[key]=S.t};
function dipGate(c,prop){
  const left=Math.max(cdLeft(c,2),prop?cdLeft(c+'#p',4):0);
  if(left>0){L(`Ещё рано: ${CN[c].n} ответит через ${left} ход.`);render();return false}
  dipMark(c);if(prop)dipMark(c+'#p');
  return true;
}
function declareWar(c){
  const k=pairKey(S.pl,c);
  S.rel[k]='war';delete S.truceEnd[k];S.wasWar=true;
  L(`Ты объявил войну: ${CN[c].n}.`);render();
}
function proposePeace(c){
  if(isHumanTarget(c)){dipRequest('peace',c,0);return}
  if(!dipGate(c,true))return;
  const pct=chanceOf(teamPow(S.team[S.pl]),teamPow(S.team[c]));
  if(roll(pct)){S.rel[pairKey(S.pl,c)]='peace';delete S.truceEnd[pairKey(S.pl,c)];L(`${CN[c].n} подписала мир с тобой.`)}
  else L(`${CN[c].n} отказалась от мира (шанс ${pct}%).`);
  render();
}
function proposeTruce(c){
  if(isHumanTarget(c)){dipRequest('truce',c,S.dMonths);return}
  if(!dipGate(c,true))return;
  const pct=chanceOf(teamPow(S.team[S.pl]),teamPow(S.team[c])),m=S.dMonths;
  if(roll(pct)){const k=pairKey(S.pl,c);S.rel[k]='truce';S.truceEnd[k]=S.t+m;L(`${CN[c].n} согласилась на перемирие на ${m} мес.`)}
  else L(`${CN[c].n} отказалась от перемирия (шанс ${pct}%).`);
  render();
}
function transferRes(c){
  if(!dipGate(c,false))return;
  const a=S.dAmt;
  if(a>S.G[S.pl]){L('Не хватает ресурсов.');render();return}
  S.G[S.pl]-=a;S.G[c]+=a;L(`Передано ${a} ресурсов: ${CN[c].n}.`);render();
}
function requestRes(c){
  const a=S.dReq;
  if(!dipGate(c,false))return;
  const pct=Math.round(100*Math.min(1,25/a));
  if(!roll(pct)){L(`${CN[c].n} отказала в ${a} ресурсах (шанс ${pct}%).`);render();return}
  if(S.G[c]<a){L(`${CN[c].n}: у неё нет ${a} ресурсов.`);render();return}
  S.G[c]-=a;S.G[S.pl]+=a;L(`${CN[c].n} дала ${a} ресурсов.`);render();
}
function leaveAlliance(){breakAlliance();L('Ты покинул союз. Бывшие союзники теперь с тобой в мире.');render()}
function joinAlliance(t){
  if(cdLeft('team:'+t,4)>0){L(`Союз ещё не готов к переговорам: подожди ${cdLeft('team:'+t,4)} ход.`);render();return}
  dipMark('team:'+t);
  const pct=chanceOf(teamPow(S.team[S.pl]),teamPow(t));
  if(roll(pct)){breakAlliance();S.team[S.pl]=t;syncPuppets();L('Ты вступил в союз.')}
  else L(`Союз отказал (шанс ${pct}%).`);
  render();
}
function inviteNeutral(c,mode){
  if(!dipGate(c,true))return;
  const pct=chanceOf(teamPow(S.team[S.pl]),strengthOf(c));
  if(!roll(pct)){L(`${CN[c].n} отказалась вступать (шанс ${pct}%).`);render();return}
  let nt;
  if(mode==='pair'){breakAlliance();nt='d'+S.pl;S.team[S.pl]=nt;syncPuppets()}
  else nt=S.team[S.pl];
  S.act[c]=true;S.team[c]=nt;S.G[c]=0;
  P.forEach(p=>{if(p.c===c&&S.ctl[p.id]===null){S.ctl[p.id]=c;S.u[p.id]=[CN[c].p,0,0,0]}});
  L(`${CN[c].n} вступила в союз.`);render();
}
function relLabel(c){
  if(S.master[c]===S.pl)return 'твоя марионетка';
  if(!S.act[c])return 'нейтрал';
  const r=rel(S.pl,c);
  if(r==='ally')return 'союзник';
  if(r==='war')return 'война';
  if(r==='truce')return `перемирие, ещё ${S.truceEnd[pairKey(S.pl,c)]-S.t} мес.`;
  if(r==='peace')return 'мир';
  return '';
}
function dpick(c){if(S.master[c]===S.pl){S.screen='puppets';render();return}S.dsel=c;render()}
function setD(k,v){S[k]=+v;render()}
function openDiplo(){S.screen='diplo';S.dsel=null;render()}
function diploList(){
  const all=CK.filter(c=>c!==S.pl&&(!S.out[c]||S.master[c]!==undefined));
  if(S.dtab==='war')return all.filter(c=>S.act[c]&&rel(S.pl,c)==='war');
  if(S.dtab==='ally')return all.filter(c=>S.act[c]&&rel(S.pl,c)==='ally');
  if(S.dtab==='truce')return all.filter(c=>S.act[c]&&(rel(S.pl,c)==='truce'||rel(S.pl,c)==='peace'));
  return all;
}
function diploDetail(c){
  const r=rel(S.pl,c);
  let h=`<h2>${CN[c].n}</h2><div class="mut">${relLabel(c)}. Сила армии: ${strengthOf(c)}. Агрессия: ${aggOf(c)} из 30.</div>`;

/* ---------- bots decide the fate of a capitulated country ---------- */
// the aggressive neighbour that holds most of the border decides, by its aggression:
// 0-9 liberate, 10-17 puppet, 18-23 split between neighbours, 24-30 take everything
function botDecide(c){
  const cnt={};
  P.forEach(p=>{if(p.c!==c||S.ctl[p.id]!==c)return;p.adj.forEach(b=>{const o=S.ctl[b];if(o!==null&&o!==c&&CK.includes(o)&&S.act[o]&&!S.out[o])cnt[o]=(cnt[o]||0)+1})});
  const best=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0];
  if(!best){botResolve(c);return}
  const A=aggOf(best);
  if(A<=9)liberate(c,best);
  else if(A<=17)puppetBot(c,best);
  else if(A<=23)botResolve(c);
  else takeAll(c,best);
}
function liberate(c,best){
  S.out[c]=false;S.libd[c]=true;S.team[c]='lib'+c;
  P.forEach(p=>{if(p.c!==c)return;if(S.ctl[p.id]===null||S.ctl[p.id]===c){S.ctl[p.id]=c;S.annex[p.id]=false;S.reb[p.id]=0;S.u[p.id]=[CN[c].p,0,0,0];S.m[p.id]=Z();S.q[p.id]=Z()}});
  S.rel[pairKey(c,best)]='peace';
  L(`${CN[best].n} освобождает ${CN[c].n}.`);
}
function puppetBot(c,best){
  S.master[c]=best;S.team[c]=S.team[best];S.share[c]=50;S.manual[c]=false;
  P.forEach(p=>{if(p.c===c&&S.ctl[p.id]===c)S.annex[p.id]=true});
  L(`${CN[best].n} делает ${CN[c].n} своей марионеткой.`);
}
function takeAll(c,best){
  P.forEach(p=>{if(p.c===c&&(S.ctl[p.id]===c||S.ctl[p.id]===null)){S.ctl[p.id]=best;S.annex[p.id]=true;S.from[p.id]=c;S.m[p.id]=Z()}});
  L(`${CN[best].n} забирает всё у ${CN[c].n}.`);
}

function distSeg(x,y,a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1];

const HR=60; // hex radius in map units (about 7.5 degrees)
function hexKey(x,y){
  // pointy-top axial coordinates with cube rounding
  const q=(Math.sqrt(3)/3*x-y/3)/HR,r=(2/3*y)/HR,s=-q-r;
  let rq=Math.round(q),rr=Math.round(r),rs=Math.round(s);
  const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs-s);
  if(dq>dr&&dq>ds)rq=-rr-rs;else if(dr>ds)rr=-rq-rs;else rs=-rq-rr;
  return rq+','+rr;
}
function buildSea(){

  for(let guard=0;guard<600;guard++){
    let small=-1;
    groups.forEach((g,k)=>{if(g.length>0&&g.length<0.5*FULL&&(small<0||g.length<groups[small].length))small=k});
    if(small<0)break;
    const nb={};
    groups[small].forEach(i=>{
      const x=i%GW,y=i/GW|0;
      [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([u,v])=>{
        if(u<0||v<0||u>=GW||v>=GH)return;
        const o=SEA[v*GW+u];if(o>=0&&o!==small)nb[o]=(nb[o]||0)+1;
      });
    });
    const keys=Object.keys(nb).map(Number);
    if(!keys.length){groups[small]=[];break}
    const tgt=keys.reduce((a,b)=>groups[b].length<groups[a].length?b:a);
    groups[small].forEach(i=>{SEA[i]=tgt});
    groups[tgt]=groups[tgt].concat(groups[small]);groups[small]=[];
  }
  groups.forEach(g=>{if(g.length)SEAZ.push({id:SEAZ.length,cells:g,adj:new Set(),name:'',x:0,y:0})});
  SEAZ.forEach(z=>z.cells.forEach(i=>{SEA[i]=z.id}));
  SEAZ.forEach((z,k)=>{
    z.name=SEA_NAMES[k%SEA_NAMES.length]+(k>=SEA_NAMES.length?' '+(Math.floor(k/SEA_NAMES.length)+1):'');
    let sx=0,sy=0;z.cells.forEach(i=>{sx+=i%GW;sy+=i/GW|0});
    z.x=(sx/z.cells.length+.5)*CS;z.y=(sy/z.cells.length+.5)*CS;
  });
  for(let i=0;i<cell.length;i++){
    if(SEA[i]<0)continue;
    if(i%GW<GW-1&&SEA[i+1]>=0&&SEA[i+1]!==SEA[i]){SEAZ[SEA[i]].adj.add(SEA[i+1]);SEAZ[SEA[i+1]].adj.add(SEA[i])}
    if(i+GW<cell.length&&SEA[i+GW]>=0&&SEA[i+GW]!==SEA[i]){SEAZ[SEA[i]].adj.add(SEA[i+GW]);SEAZ[SEA[i+GW]].adj.add(SEA[i])}
  }
  SEAZ.forEach(z=>{z.adj=[...z.adj]});
}
// make the sea zones roughly equal in area (projection ignored): small zones merge into their smallest neighbour,
// big ones are split in two
function balanceSea(){
  const ocean=[];for(let i=0;i<cell.length;i++)if(SEA[i]>=0)ocean.push(i);
  const groups=()=>{const m={};ocean.forEach(i=>{const id=SEA[i];(m[id]=m[id]||[]).push(i)});return m};
  const avg=ocean.length/Math.max(1,Object.keys(groups()).length);
  for(let guard=0;guard<600;guard++){
    const m=groups(),ids=Object.keys(m).map(Number);
    if(ids.length<=2)break;
    const small=ids.reduce((a,b)=>m[b].length<m[a].length?b:a);
    if(m[small].length>=0.6*avg)break;
    const nb={};
    m[small].forEach(i=>{const x=i%GW,y=i/GW|0;
      [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([u,v])=>{
        if(u<0||v<0||u>=GW||v>=GH)return;const o=SEA[v*GW+u];
        if(o>=0&&o!==small)nb[o]=(nb[o]||0)+1;
      });
    });
    const keys=Object.keys(nb).map(Number);
    if(!keys.length)break;
    const tgt=keys.reduce((a,b)=>m[b].length<m[a].length?b:a);
    m[small].forEach(i=>{SEA[i]=tgt});
  }
  for(let guard=0;guard<60;guard++){
    const m=groups();let big=null;
    Object.keys(m).forEach(k=>{const a=m[k].length;if(a>1.6*avg&&(big===null||a>m[big].length))big=Number(k)});
    if(big===null)break;
    const cells=m[big],pos=i=>[i%GW,i/GW|0];
    const [ax,ay]=pos(cells[0]);
    let far=cells[0],fd=-1;
    cells.forEach(i=>{const [x,y]=pos(i);const d=(x-ax)**2+(y-ay)**2;if(d>fd){fd=d;far=i}});
    let c1=pos(cells[0]),c2=pos(far);
    for(let it=0;it<6;it++){
      const g1=[0,0,0],g2=[0,0,0];
      cells.forEach(i=>{const [x,y]=pos(i);const d1=(x-c1[0])**2+(y-c1[1])**2,d2=(x-c2[0])**2+(y-c2[1])**2;const g=d1<=d2?g1:g2;g[0]+=x;g[1]+=y;g[2]++});
      if(g1[2])c1=[g1[0]/g1[2],g1[1]/g1[2]];
      if(g2[2])c2=[g2[0]/g2[2],g2[1]/g2[2]];
    }
    const newId=Math.max(...Object.keys(m).map(Number))+1;
    cells.forEach(i=>{const [x,y]=pos(i);const d1=(x-c1[0])**2+(y-c1[1])**2,d2=(x-c2[0])**2+(y-c2[1])**2;if(d2<d1)SEA[i]=newId});
  }
  // renumber zones 0..n-1 and rebuild the zone list
  const remap={};
  SEAZ.length=0;
  ocean.forEach(i=>{
    const o=SEA[i];
    if(remap[o]===undefined){remap[o]=SEAZ.length;SEAZ.push({id:SEAZ.length,cells:[],adj:new Set(),name:'',x:0,y:0})}
    SEA[i]=remap[o];SEAZ[remap[o]].cells.push(i);
  });
}

/* ---------- fleet: destroyers, submarines, cruisers ---------- */
const SHIPS=[
 {n:'Эсминец',e:'🚤',cost:120,atk:5,def:2},
 {n:'Подводная лодка',e:'🥷',cost:250,atk:10,def:8},
 {n:'Крейсер',e:'⛴️',cost:445,atk:25,def:35}
];
const zTot=f=>f?f.n[0]+f.n[1]+f.n[2]:0;
const shipAtk=n=>n.reduce((a,x,i)=>a+x*SHIPS[i].atk,0);
const shipDef=n=>n.reduce((a,x,i)=>a+x*SHIPS[i].def,0);
const shipsTxt=n=>SHIPS.map((sh,i)=>n[i]?`${sh.e}${n[i]}`:'').filter(Boolean).join(' ');
// land provinces touching a sea zone, and sea zones touching a shipyard province
const zoneLands=zid=>{
  const z=SEAZ[zid];if(z.lands)return z.lands;
  const set=new Set();
  z.cells.forEach(i=>{const x=i%GW,y=i/GW|0;[[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([u,v])=>{if(u<0||v<0||u>=GW||v>=GH)return;const a=cell[v*GW+u];if(a>=0)set.add(a)})});
  z.lands=[...set];return z.lands;
};
const yardZones=p=>{
  if(p.yz)return p.yz;
  const set=new Set();
  p.cells.forEach(i=>{const x=i%GW,y=i/GW|0;[[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([u,v])=>{if(u<0||v<0||u>=GW||v>=GH)return;const j=v*GW+u;if(cell[j]===-1)set.add(SEA[j])})});
  p.yz=[...set];return p.yz;
};
// a zone is blocked for building when an enemy fleet sits in it
const zBlocked=zid=>{const f=S.zf[zid];return !!f&&!isMy(f.c)&&rel(S.pl,f.c)==='war'};
function buyShip(zid,t){
  if(MP&&!MP.host){sendOrder({k:'buy',zid,t});return}
  const sh=SHIPS[t];
  if(zBlocked(zid)){L('Зона заблокирована вражеским флотом.');render();return}
  if(S.G[S.pl]<sh.cost){L('Не хватает ресурсов.');render();return}
  S.G[S.pl]-=sh.cost;S.shipQ.push({zid,c:S.pl,t,arrive:S.t+2});
  sfx('buy');L(`Куплен: ${sh.n}, прибудет через 2 хода.`);render();
}
// the whole fleet moves one zone per turn; a fleet that just arrived waits until next turn
function fleetMove(from,to){
  if(MP&&!MP.host){sendOrder({k:'fleet',from,to});return}
  const f=S.zf[from];
  if(!f||!isMy(f.c))return;
  if(S.fmv[from]===S.t){L('Флот уже двигался в этом ходу.');render();return}
  if(!SEAZ[from].adj.includes(to))return;
  const dst=S.zf[to];
  if(dst&&dst.c!==f.c&&rel(f.c,dst.c)!=='war'){L('Зона закрыта: вы не в войне с её хозяином.');render();return}
  if(!dst||dst.c===f.c){
    const sum=f.n.map((x,i)=>x+(dst?dst.n[i]:0));
    if(sum[0]+sum[1]+sum[2]>12){L('В зоне не больше 12 кораблей.');render();return}
    S.zf[to]={c:f.c,n:sum};delete S.zf[from];S.fmv[to]=S.t;S.fsel=to;
  }else{
    const A=shipAtk(f.n)*(.8+Math.random()*.4),D=shipDef(dst.n)*(.8+Math.random()*.4);
    sfx('boom');
    if(A>D*1.1){S.zf[to]={c:f.c,n:f.n.slice()};delete S.zf[from];S.fmv[to]=S.t;S.fsel=to;L(`Флот топит вражеские корабли в «${SEAZ[to].name}».`)}
    else if(A<D*0.9){delete S.zf[from];S.fsel=null;L(`Ваш флот потоплен у «${SEAZ[to].name}».`)}
    else L('Бой в море без перевеса: ничего не произошло.');
  }
  render();
}
// landing: 5 elite infantry from the sea zone onto an adjacent enemy province; destroyers every 3 turns, cruisers every 2
function landing(zid,b){
  if(MP&&!MP.host){sendOrder({k:'land',zid,b});return}
  sfx('land');
  const f=S.zf[zid];
  if(!f||!isMy(f.c))return;
  if(f.n[0]+f.n[2]===0){L('Только подлодки: десант не сбросить.');render();return}
  const need=f.n[2]>0?2:3;
  const last=S.landT[zid]===undefined?-99:S.landT[zid];
  if(S.t-last<need){L(`Десант можно сбросить раз в ${need} хода.`);render();return}
  if(!zoneLands(zid).includes(b)||S.ctl[b]===null||rel(f.c,S.ctl[b])!=='war')return;
  S.landT[zid]=S.t;
  const sum=[0,5,0,0],d=S.u[b];
  if(!tot(d)){cap(b,f.c,sum);check();render();return}
  const A=strengthOwn(sum,f.c)*(.8+Math.random()*.4),D=strengthOwn(d,S.ctl[b])*1.25*(.8+Math.random()*.4);
  if(Math.abs(A-D)<=0.1*Math.max(A,D)){S.u[b]=Z();L(`Равный десант у «${P[b].name}»: обе стороны погибли.`);check();render();return}
  if(A>D){S.u[b]=Z();cap(b,f.c,[0,Math.max(1,Math.round(5*(1-(D/A)**2))),0,0])}
  else{S.u[b]=d.map(x=>Math.round(x*Math.max(.15,1-(A/D)**2)));L(`Десант у «${P[b].name}» разбит.`)}
  check();render();
}
function seaClick(z){
  const f=S.fsel!==null?S.zf[S.fsel]:null;
  if(f&&isMy(f.c)&&S.fsel!==z&&SEAZ[S.fsel].adj.includes(z)){fleetMove(S.fsel,z);return}

function seaPanel(){

    lands.forEach(b=>{h+=`<div class="row"><button class="g" onclick="landing(${S.fsel},${b})">Высадиться: ${P[b].name}</button></div>`});

  }
  return h+logHTML();

// factories per country; placed in the most productive provinces of that country
const FAC1={PY:2,UY:1,AR:2,BR:3,CL:2,PE:2,BO:2,EC:1,CO:2,VE:2,CM:1,MX:2,US:3,UK:4};
const FAC2={PY:2,UY:1,RBA:1,SLP:1,BR:3,CL:2,PE:2,BO:2,EC:1,CO:2,VE:2,CM:1,MX:2,US:3,UK:4};
const FAC3={PY:2,UY:1,AR:2,BR:3,CL:2,PE:2,BO:2,EC:1,CO:2,VE:2,CM:1,MX:2,UN:2,CS:1,UK:4};
function assignFac(){
  const T=SCEN===2?FAC2:SCEN===3?FAC3:FAC1;
  P.forEach(p=>p.fac=false);
  Object.keys(T).forEach(c=>{
    P.filter(p=>p.c===c).sort((a,b)=>b.inc-a.inc||a.id-b.id).slice(0,T[c]).forEach(p=>p.fac=true);
  });
}
function CKV(){
  if(SCEN===2)return CK.filter(c=>c!=='AR'&&c!=='UN'&&c!=='CS');
  if(SCEN===3)return CK.filter(c=>c!=='US'&&c!=='RBA'&&c!=='SLP');
  return CK.filter(c=>c!=='RBA'&&c!=='SLP'&&c!=='UN'&&c!=='CS');
}
function applyScenario(){
  const s2=SCEN===2;
  // civil war in the USA: below 37 degrees north the provinces form the Confederacy, the rest the Union
  P.forEach(p=>{if(p.c0!=='US')return;p.c=SCEN===3?((62-p.y/K)<37?'CS':'UN'):'US'});
  if(SCEN===3){CN.UN.k=P.filter(p=>p.c==='UN').length;CN.CS.k=P.filter(p=>p.c==='CS').length}
  CN.BR.p=s2?1:2;
  CN.UY.p=s2?4:2;
  CN.RBA.p=s2?3:3;CN.RBA.g=s2?3:2;
  CN.SLP.p=s2?1:1;CN.SLP.g=s2?1:2;
  const ar=P.filter(p=>p.c0==='AR').sort((a,b)=>a.y-b.y);
  let kr=0,ks=0;
  ar.forEach((p,i)=>{
    if(!s2){p.c='AR';p.lbl=CN0.AR.n;p.k=p.k0}
    else if(i<Math.round(ar.length*5/14)){p.c='RBA';p.lbl=CN0.RBA.n;p.k=++kr}
    else{p.c='SLP';p.lbl=CN0.SLP.n;p.k=++ks}
  });
  P.forEach(p=>{p.name=p.cityName});
  if(s2){CN.RBA.k=kr;CN.SLP.k=ks}
  assignFac();
}
function setScen(n){SCEN=n;SEL=n===2?{BR:0,SLP:0,UY:1,PY:1,RBA:1}:n===3?{UN:0,CS:1}:{};SELPL=n===2?'BR':n===3?'UN':null;applyScenario();setup()}
function applyRenames(){
  const full=(c,owner)=>{const ps=P.filter(p=>p.c===c);return ps.length>0&&ps.every(p=>S.ctl[p.id]===owner)};
  if(S.act.CO&&full('VE','CO')&&full('EC','CO'))CN.CO.n='Великая Колумбия';
  if(S.act.PE&&S.act.BO){
    if(full('BO','PE'))CN.PE.n='Конфед. Перу-Боливия';
    else if(full('PE','BO'))CN.BO.n='Конфед. Перу-Боливия';
  }
}

const income=c=>P.reduce((t,p)=>t+(S.ctl[p.id]===c?p.inc:0),0);
const incomeOf=c=>{const base=income(c)*(c==='PY'?0.4:1)*ECON[econOf(c)].inc*ideoV(c,'inc',1)*((S.econT&&S.econT[c]!==undefined&&S.t<S.econT[c])?0.8:1);return Math.round(S.mob[c]?base/2:base)};
function toggleMob(){if(S.t<PEACE||mobPct(S.pl)>=mobCap(S.pl))return;S.mob[S.pl]=!S.mob[S.pl];L(S.mob[S.pl]?'Мобилизация: доход вдвое меньше, на заводах каждый ход появляются войска.':'Мобилизация отменена.');render()}
const free=pid=>12-tot(S.u[pid])-tot(S.q[pid]);
const str=pid=>pw(S.u[pid])+pw(S.q[pid]);
const bump=(o,a,c,n)=>{o[a]=o[a]||{};o[a][c]=(o[a][c]||0)+n};
const gv=(o,a,c)=>(o[a]&&o[a][c])||0;
const mobPct=c=>(S.mobN[c]||0)*200/POP[c];
const mobCap=c=>c==='PY'?70:40;
const movv=pid=>S.u[pid].map((x,t)=>x-S.m[pid][t]);
const mov=pid=>tot(movv(pid));
// divisions of a province not yet committed to a plan
const avail=pid=>{const c=Z();S.plans.forEach(q=>{if(q.a===pid)q.v.forEach((x,t)=>c[t]+=x)});return movv(pid).map((x,t)=>Math.max(0,x-c[t]))};
const lostOf=c=>P.filter(p=>p.c===c&&(S.ctl[p.id]===null||S.team[S.ctl[p.id]]!==S.team[c])).length;
const vis=pid=>{if(S.spec)return true;if(yardZones(P[pid]).some(z=>S.zf[z]&&isMy(S.zf[z].c)))return true;const c=S.ctl[pid];if(c===null||S.team[c]===S.team[S.pl])return true;return P[pid].adj.some(b=>S.ctl[b]!==null&&S.team[S.ctl[b]]===S.team[S.pl])};
const rate=pid=>{const c=S.ctl[pid];if(c===null||!S.annex[pid])return 0;return (S.master[c]!==undefined?3:7)*ideoV(c,'rebel',1)};
const comp=v=>v.map((x,t)=>x?`${NM[t]} ${x}`:'').filter(Boolean).join(', ')||'пусто';
const owner=c=>c===S.pl?'у тебя':c===null?'нейтрально':CN[c].n;
const L=t=>{S.log.unshift(t);if(S.log.length>60)S.log.length=60};

function begin(){

     annex:P.map(()=>false),prevNear:P.map(()=>0),mob:{},mobN:{},mobOut:{},kills:{},caps:{},touch:{},rel:{},truceEnd:{},dAmt:50,dReq:50,dMonths:3,dsel:null,zero:ZERO,wasWar:false,events:[],dtab:'act',reqTurn:-9,cool:{},libd:{},rep:{},econ:{},econT:{},ideo:{},ideoN:{},ideoT:{},zf:{},shipQ:[],landT:{},fmv:{},fsel:null,spec:SELPL==='SPEC',from:P.map(()=>null),reb:P.map(()=>0),pending:[],screen:'main',

/* ---------- combat and politics ---------- */
function join(c){
  S.act[c]=true;S.team[c]='n'+c;S.G[c]=0;
  P.forEach(p=>{if(p.c===c&&S.ctl[p.id]===null){S.ctl[p.id]=c;S.u[p.id]=[CN[c].p,0,0,0]}});
  L(`${CN[c].n} вступает в войну против всех.`);
}
function capitulate(c){
  S.out[c]=true;L(`${CN[c].n} капитулирует.`);
  if(c===S.pl){S.over='lose';return}
  if(S.team[c]===S.team[S.pl]){
    P.forEach(p=>{if(p.c===c&&S.ctl[p.id]===c){S.ctl[p.id]=null;S.u[p.id]=Z();S.m[p.id]=Z();S.q[p.id]=Z();S.annex[p.id]=false;S.reb[p.id]=0}});
    return;
  }
  if(S.spec||BOTDECIDE||shouldBotDecide(c)){L(`Решение за ${CN[c].n} принимают боты.`);botDecide(c);return}
  S.pending.push({c,redist:false,puppet:false,asg:{}});
}
function check(){
  trackContact();
  CK.forEach(c=>{
    if(!S.act[c]||S.out[c]||S.master[c]!==undefined||S.libd[c])return;
    if(capitulatesNow(c))capitulate(c);
  });
  applyRenames();
  if(S.spec){}
  else if(S.out[S.pl]){S.over='lose';sfx('lose')}
  else if(!S.won&&(!S.zero||S.wasWar)&&!CK.some(c=>S.act[c]&&!S.out[c]&&S.master[c]===undefined&&rel(S.pl,c)==='war')){S.won=true;S.starOn=true;sfx('win');L('Миссия выполнена!')}
}
function cap(b,c,v){
  S.ctl[b]=c;S.u[b]=v.slice();S.m[b]=v.slice();S.q[b]=Z();S.annex[b]=false;S.reb[b]=0;
  const who=S.team[c]===S.team[S.pl]?(isMy(c)?'Ты занял':'Союзник занял'):'Противник занял';
  L(`${who} «${P[b].name}» (${tot(v)} див.).`);
}
// pieces: [{a, v}] — all attackers hit province b at once
function go(b,pieces){
  if(isMy(S.ctl[pieces[0].a])||isMy(S.ctl[b]))sfx('shot');
  const blocked=pieces.some(q=>mtnEdge(q.a,b)&&(q.v[2]||q.v[3]));
  pieces=pieces.map(q=>mtnEdge(q.a,b)?{a:q.a,v:[q.v[0],q.v[1],0,0]}:q).filter(q=>tot(q.v)>0);
  if(blocked)L('Техника не может пройти через горы.');
  if(!pieces.length)return;
  const c=S.ctl[pieces[0].a],sum=Z();
  pieces.forEach(({a,v})=>v.forEach((x,t)=>{sum[t]+=x;S.u[a][t]-=x}));
  const own=S.ctl[b]===c||(isMy(c)&&isMy(S.ctl[b]));
  if(own){
    if(S.reb[b]>0){
      const D=S.reb[b]*2,A=pw(sum)*(.8+Math.random()*.4);
      if(A>D){S.reb[b]=0;S.u[b]=clamp10(S.u[b].map((x,t)=>x+sum[t]));L(`Восстание в «${P[b].name}» подавлено.`)}
      else{S.reb[b]=Math.max(0,S.reb[b]-1);L(S.reb[b]?`Атака на восстание в «${P[b].name}» отбита.`:`Восстание в «${P[b].name}» подавлено.`)}
      return;
    }
    S.u[b]=clamp10(S.u[b].map((x,t)=>x+sum[t]));S.m[b]=S.m[b].map((x,t)=>x+sum[t]);
    L(`Перегруппировка в «${P[b].name}».`);return;
  }
  if(S.ctl[b]!==null&&S.team[S.ctl[b]]===S.team[c])return;
  if(S.ctl[b]===null&&!S.act[P[b].c])join(P[b].c);
  const defC=S.ctl[b];
  if(defC!==null&&rel(c,defC)!=='war')return;
  const d=S.u[b];
  if(!tot(d)){if(CK.includes(defC))bump(S.caps,c,defC,1);cap(b,c,sum);check();return}
  const A=strengthOwn(sum,c)*(.8+Math.random()*.4),D=strengthOwn(d,S.ctl[b])*1.25*(.8+Math.random()*.4);
  if(Math.abs(A-D)<=0.1*Math.max(A,D)){S.u[b]=Z();L(`Равный бой за «${P[b].name}»: обе стороны погибли.`);check();return}
  if(A>D){
    const f=Math.max(.15,1-(D/A)**2);let s=sum.map(x=>Math.round(x*f));
    if(!tot(s))s[sum.findIndex(x=>x>0)]=1;
    if(CK.includes(defC)){bump(S.kills,c,defC,tot(d));bump(S.caps,c,defC,1)}
    S.u[b]=Z();cap(b,c,s);
  }else{
    const g=Math.max(.15,1-(A/D)**2);let s=d.map(x=>Math.round(x*g));
    if(!tot(s))s[d.findIndex(x=>x>0)]=1;
    if(CK.includes(defC))bump(S.kills,c,defC,tot(d)-tot(s));
    S.u[b]=s;L(`Атака на «${P[b].name}» отбита.`);
  }
  check();
}

// character of each country: aggression 0 (only hold the border) .. 30 (break through and take everything)
const AGG={PY:24,UY:16,AR:14,BR:20,CL:6,PE:9,BO:8,EC:5,CO:11,VE:13,CM:4,MX:10,US:9,UK:12,RBA:22,SLP:7};
const aggOf=c=>AGG[c]===undefined?10:AGG[c];
/* ---------- surrender, coasts, navy doctrine ---------- */
function surrender(){
  if(S.over||S.spec)return;
  if(!confirm('Сдаться? Игра закончится поражением.'))return;
  S.over='lose';L('Вы сдались.');render();
}
// a province with an ocean cell next to it
function isCoast(b){
  const p=P[b];
  if(p.coast!==undefined)return p.coast;
  p.coast=p.cells.some(i=>{const x=i%GW,y=i/GW|0;return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].some(([u,v])=>u>=0&&v>=0&&u<GW&&v<GH&&cell[v*GW+u]===-1)});
  return p.coast;
}
// aggressive fleet with nothing to fight: sails to the nearest zone that touches enemy land
function botPush(c,z,f){
  const tgt=SEAZ[z].adj.find(b=>{
    const g=S.zf[b];
    return(!g||g.c===c)&&zTot(g)+zTot(f)<=12&&zoneLands(b).some(x=>S.ctl[x]!==null&&S.ctl[x]!==c&&rel(c,S.ctl[x])==='war');
  });
  if(tgt===undefined)return;
  const g=S.zf[tgt];
  S.zf[tgt]={c,n:(g?g.n:[0,0,0]).map((x,i)=>x+f.n[i])};
  delete S.zf[z];S.fmv[tgt]=S.t;
}

/* ---------- economies and ideologies ---------- */
const ECON={

 plan:{name:'Плановая',inc:0.85,cost:0.8,desc:'доход −15%, войска дешевле на 20%, мобилизация даёт на завод одну лишнюю пехотинцу'}
};

const IDEO={
 liberalism:{name:'Либерализм',dip:10,rebel:1.3,inc:1.05,desc:'дипломатия +10%, восстания ×1,3, доход +5%'},
 conservatism:{name:'Консерватизм',dip:-5,rebel:0.5,cost:1.05,desc:'дипломатия −5%, восстания ×0,5, войска дороже на 5%'},
 democracy:{name:'Демократия',dip:5,rebel:0.7,desc:'дипломатия +5%, восстания ×0,7'},
 socialism:{name:'Социализм',cost:0.9,inc:0.95,morale:0.8,desc:'войска дешевле на 10%, доход −5%, боевой дух: капитулирует только после потери 80% провинций'},
 nationalism:{name:'Национализм',atk:1.1,dip:-15,morale:0.8,desc:'атака твоих дивизий ×1,1, дипломатия −15%, боевой дух: капитулирует только после потери 80% провинций'}
};
const econOf=c=>(S.econ&&S.econ[c])||'mixed';
const ideoV=(c,k,def)=>{const id=S.ideo&&S.ideo[c];if(!id)return def;const v=IDEO[id][k];return v===undefined?def:v};
const costOf=(c,t)=>Math.round(CT[t]*ECON[econOf(c)].cost*ideoV(c,'cost',1));
function setEcon(k){
  if(econOf(S.pl)===k)return;
  if(S.G[S.pl]<50){L('Смена экономики стоит 50 ресурсов.');render();return}
  S.G[S.pl]-=50;S.econ[S.pl]=k;S.econT[S.pl]=S.t+3;
  L(`Экономика: ${ECON[k].name}. Три хода переходного периода, доход −20%.`);render();
}
function setIdeo(k){
  const cur=S.ideo[S.pl];
  if(cur===k)return;
  if(cur===undefined){S.ideo[S.pl]=k;S.ideoT[S.pl]=S.t;L(`Идеология: ${IDEO[k].name}.`);render();return}
  const n=S.ideoN[S.pl]||0;
  if(n>=2){L('Идеологию можно сменить только 2 раза за игру.');render();return}
  const since=S.t-(S.ideoT[S.pl]===undefined?-99:S.ideoT[S.pl]);
  if(since<15){L(`Идеологию меняют раз в 15 ходов. Ещё ${15-since}.`);render();return}
  S.ideo[S.pl]=k;S.ideoN[S.pl]=n+1;S.ideoT[S.pl]=S.t;
  L(`Идеология сменилась на «${IDEO[k].name}».`);render();
}
function openState(){S.screen='state';render()}
function stateHTML(){
  const e=econOf(S.pl),id=S.ideo[S.pl];
  const n=S.ideoN[S.pl]||0,since=S.t-(S.ideoT[S.pl]===undefined?-99:S.ideoT[S.pl]);
  let h=`<h2>Государство</h2><div class="mut">Экономика</div><div class="row">`+Object.keys(ECON).map(k=>`<button class="${e===k?'':'g'}" onclick="setEcon('${k}')">${ECON[k].name}</button>`).join('')+`</div>`;
  h+=`<div class="mut">${ECON[e].name}: ${ECON[e].desc}. Смена стоит 50 ресурсов и даёт три хода переходного периода (доход −20%).</div>`;
  h+=`<h2 style="margin-top:12px">Идеология</h2><div class="row">`+Object.keys(IDEO).map(k=>`<button class="${id===k?'':'g'}" onclick="setIdeo('${k}')">${IDEO[k].name}</button>`).join('')+`</div>`;
  h+=`<div class="mut">${id?`${IDEO[id].name}: ${IDEO[id].desc}.`:'Идеология ещё не выбрана: первый выбор бесплатен.'} Смены: ${n} из 2${id&&n<2&&since<15?`, следующая через ${15-since} ход.`:'.'}</div>`;
  return h+`<div class="row"><button onclick="S.screen='main';render()">В игру</button></div>`;

/* ---------- from scratch: nobody is anybody's ally or enemy at the start ---------- */
// in this mode every relation is peace until somebody declares war
function allyUp(a,b){
  const t=S.team[a];
  CK.forEach(x=>{if(S.act[x]&&!S.out[x]&&S.team[x]===S.team[b])S.team[x]=t});
  syncPuppets();
}
function proposeAlliance(c){
  if(isHumanTarget(c)){dipRequest('ally',c,0);return}
  if(!dipGate(c,true))return;
  const pct=Math.round(0.4*chanceOf(teamPow(S.team[S.pl]),teamPow(S.team[c])));
  if(roll(pct)){allyUp(S.pl,c);L(`${CN[c].n} вступила в ваш союз.`)}
  else L(`${CN[c].n} отказалась от союза (шанс ${pct}%).`);
  render();
}
// bots: aggressive ones pick wars with neighbours, calm ones look for allies among their peaceful neighbours
function botDiplo(c){
  if(!S.zero||S.mpNeutral)return;
  const agg=aggOf(c);
  const nb=[...new Set(P.filter(p=>S.ctl[p.id]===c).flatMap(p=>p.adj.map(b=>S.ctl[b])))]
    .filter(x=>x!==null&&x!==c&&CK.includes(x)&&S.act[x]&&!S.out[x]&&S.master[x]===undefined);
  nb.forEach(x=>{
    const r=rel(c,x);
    if(r!=='peace')return;
    if(agg>=12&&Math.random()<agg/400){
      S.rel[pairKey(c,x)]='war';S.wasWar=true;
      if(isMy(x)||isMy(c))L(`${CN[c].n} объявляет войну: ${CN[x].n}.`);
    }else if(agg<12&&Math.random()<0.01){
      // calm countries ask the player (or his allies) for an alliance as an event
      if(isMy(x)||(x!==S.pl&&S.team[x]===S.team[S.pl])){
        if(!S.events.some(e=>e.from===c))S.events.push({from:c,to:S.pl});
      }else allyUp(c,x);
    }
  });
}

/* ---------- alliance requests and betrayals ---------- */
function eventHTML(){
  const ev=S.events[0];
  return `<h2>Предложение союза</h2><div class="mut">${CN[ev.from].n} просит вступить в союз с тобой и твоими союзниками.</div><div class="row"><button onclick="answerEvent(true)">Принять</button><button class="g" onclick="answerEvent(false)">Отказаться</button></div>`+logHTML();
}
function answerEvent(ok){
  const ev=S.events.shift();
  if(ok&&S.act[ev.from]&&!S.out[ev.from]){allyUp(S.pl,ev.from);L(`${CN[ev.from].n} вступила в ваш союз.`)}
  else if(!ok)L(`Вы отказались от союза с ${CN[ev.from].n}.`);
  render();
}
// members of an alliance may leave it and join the side they are fighting against
function betrayals(){
  const teams={};
  CK.forEach(x=>{if(S.act[x]&&!S.out[x]&&S.master[x]===undefined)(teams[S.team[x]]=teams[S.team[x]]||[]).push(x)});
  Object.keys(teams).forEach(t=>{
    const mem=teams[t];
    if(mem.length<2)return;
    mem.forEach(x=>{
      if(x===S.pl||S.team[x]!==t)return;
      if(Math.random()>0.02*(aggOf(x)>=12?2:1))return;
      const foes=CK.filter(y=>S.act[y]&&!S.out[y]&&S.master[y]===undefined&&S.team[y]!==t&&mem.some(m=>rel(m,y)==='war'));
      S.team[x]=foes.length?S.team[foes[0]]:('b'+x);
      mem.forEach(m=>{if(m!==x)S.rel[pairKey(m,x)]='war'});
      S.wasWar=true;
      if(isMy(x)||mem.some(m=>isMy(m)))L(`${CN[x].n} предала союз и перешла на сторону ${foes.length?CN[foes[0]].n:'себя'}.`);
    });
  });
  syncPuppets();
}

/* ---------- stage 1: save and restore the whole game as one JSON document ---------- */
// the map geometry is rebuilt from the settings, so only the state is stored
const SNAP_KEYS=['mpNeutral','human','humanOwner','t','pl','team','act','out','G','master','share','manual','mobN','mobOut','kills','caps','touch','libd','rep','rel','truceEnd','cool','econ','econT','ideo','ideoN','ideoT','zf','shipQ','landT','fmv','fsel','prevNear','won','starOn','wasWar','zero','spec','reqTurn','dAmt','dReq','dMonths','mob','log','events','mode'];
const SNAP_ARRAYS=['ctl','u','q','annex','from','reb'];
function snapshot(){
  const d={v:1,settings:{SCEN,PLUS,FFA,ZERO,NOCLIP,BOTDECIDE,SEL,SELPL,peace:PEACE}};
  SNAP_KEYS.forEach(k=>{d[k]=S[k]});
  SNAP_ARRAYS.forEach(k=>{d[k]=S[k]});
  return d;
}
function restoreSnapshot(d){
  SCEN=d.settings.SCEN;PLUS=d.settings.PLUS;FFA=d.settings.FFA;ZERO=d.settings.ZERO;
  NOCLIP=d.settings.NOCLIP;BOTDECIDE=d.settings.BOTDECIDE;SEL=d.settings.SEL;SELPL=d.settings.SELPL;
  PEACE=d.settings.peace||10;
  rebuildAll();
  begin();
  SNAP_KEYS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
  SNAP_ARRAYS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
  render();
}
// size of the saved state now, its growth per turn over the last turns, and how many turns are left to the 256 KiB limit
function reportSize(){
  const size=JSON.stringify(snapshot()).length;
  const h=S.szHist||[],last=h.slice(-6);
  const growth=last.length>1?(last[last.length-1]-last[0])/(last.length-1):0;
  const left=262144-size;
  const turns=growth>0?Math.floor(left/growth):null;
  L(`Состояние: ${(size/1024).toFixed(1)} КБ из 256 КБ. Прирост за ход: ${(growth/1024).toFixed(2)} КБ. ${turns!==null?`До лимита примерно ${turns} ходов.`:'Прирост пока не виден: сыграй пару ходов.'}`);
  render();
}

const errText=e=>{const c=(e&&(e.code||e.name))||'';const m=(e&&e.message)||String(e);return `${c} ${m}`.trim()};
const randCode=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const modeText=m=>`${m.SCEN===2?'Аргентина':m.SCEN===3?'Гражд. США':'Классика'}${m.PLUS?', Провинции+':''}${m.ZERO?', с нуля':''}${m.FFA?', каждый сам':''}`;
function saveName(){
  const v=((document.getElementById('nm')||{}).value||'').trim();
  if(!v)return;
  LB.name=v;try{sessionStorage.setItem('americas-name',v)}catch(e){}

function lobby(){LB.active=true;LB.room=null;renderLobby()}
function lbMsg(t){LB.msg=t;renderLobby()}
function togM(k){if(k==='SCEN')SCEN=SCEN===1?2:SCEN===2?3:1;else if(k==='PLUS')PLUS=!PLUS;else if(k==='ZERO')ZERO=!ZERO;else if(k==='FFA')FFA=!FFA;renderLobby()}
function togF(k){
  const cyc={PLUS:[undefined,true,false],ZERO:[undefined,true,false],FFA:[undefined,true,false],SCEN:[undefined,1,2,3]}[k];

function renderLobby(){

    +`<button class="g" onclick="togM('FFA')">Каждый сам: ${FFA?'да':'нет'}</button>`

  h+=`<h2 style="margin-top:12px">Публичные комнаты</h2><div class="row">`

// the countries of a room follow the room's scenario, not the viewer's own settings
const roomCountries=d=>d.SCEN===2?CK.filter(c=>c!=='AR'&&c!=='UN'&&c!=='CS'):d.SCEN===3?CK.filter(c=>c!=='US'&&c!=='RBA'&&c!=='SLP'):CK.filter(c=>c!=='RBA'&&c!=='SLP'&&c!=='UN'&&c!=='CS');
function renderRoom(ov){
  const d=LB.data||{},slots=d.slots||{},isHost=d.host===ME;
  let h=`<h1>Комната ${LB.room}</h1><div class="mut">${modeText(d)} · ${d.public?'публичная':'приватная'} · ${d.status==='lobby'?'ожидание':'игра идёт'}</div><div class="mut">${LB.msg}</div>`;
  h+=`<h2 style="margin-top:12px">Страны</h2><div class="gr">`+roomCountries(d).map(c=>{const o=slots[c];return `<button class="${o?'g':''}" onclick="lbClaim('${c}')">${CN[c].n}: ${o?(o===ME?'ты':'занята'):'свободна'}</button>`}).join('')+`</div>`;

const roomRow=r=>({code:r.code,host:r.host,public:r.is_public,status:r.status,SCEN:r.scen,PLUS:r.plus,ZERO:r.zero,FFA:r.ffa,slots:r.slots||{}});
async function lbRefresh(){
  if(!DB||!LB.room)return renderLobby();
  try{
    const {data,error}=await DB.from('rooms').select('*').eq('code',LB.room).maybeSingle();
    if(error)LB.msg='Ошибка: '+error.message;
    else if(!data){LB.room=null;LB.msg='Комната не найдена.'}
    else{
      LB.data=roomRow(data);LB.data.queue=data.queue||[];
      if(ME&&!LB.data.queue.includes(ME)){
        const q=[...LB.data.queue,ME];
        await DB.from('rooms').update({queue:q}).eq('code',LB.room);
        LB.data.queue=q;
      }
    }
  }catch(e){LB.msg='Не удалось получить комнату: попробуй ещё раз.'}
  renderLobby();
}


async function lbCreate(pub){
  if(!DB)return lbMsg('Нет связи с сервером.');
  const code=randCode();
  const {error}=await DB.from('rooms').insert({code,host:ME,is_public:pub,status:'lobby',scen:SCEN,plus:PLUS,zero:ZERO,ffa:FFA});
  if(error)return lbMsg('Ошибка: '+error.message);
  LB.room=code;LB.msg='';await lbRefresh();
}

async function lbList(){
  if(!DB)return lbMsg('Нет связи с сервером.');
  const map={PLUS:'plus',ZERO:'zero',FFA:'ffa',SCEN:'scen'};
  let q=DB.from('rooms').select('*').eq('is_public',true).limit(50);
  Object.keys(LB.f).forEach(k=>{if(LB.f[k]!==undefined)q=q.eq(map[k],LB.f[k])});
  const {data,error}=await q;
  if(error)return lbMsg('Ошибка: '+error.message);
  LB.list=(data||[]).map(roomRow);LB.msg='';renderLobby();
}

async function lbRandom(){
  if(!DB)return lbMsg('Нет связи с сервером.');
  const {data}=await DB.from('rooms').select('code').eq('is_public',true).eq('status','lobby').limit(50);
  if(!data||!data.length)return lbCreate(true);
  LB.room=data[Math.random()*data.length|0].code;LB.msg='';await lbRefresh();
}

async function lbJoin(){
  const code=((document.getElementById('code')||{}).value||'').trim().toUpperCase();
  if(!code)return lbMsg('Введи код.');
  LB.code=code;LB.room=code;LB.msg='';await lbRefresh();
}
function lbOpen(id){LB.room=id;LB.msg='';lbRefresh()}
// first come, first served: a short lease on the room, then the country must still be free
async function lbClaim(c){
  if(!DB||!LB.room)return lbMsg('Нет связи с сервером.');
  const slots=(LB.data&&LB.data.slots)||{};
  const mine=Object.keys(slots).find(k=>slots[k]===ME);
  if(mine&&mine!==c)await DB.rpc('release_slot',{room_code:LB.room,country:mine,player:ME});
  const {data,error}=await DB.rpc('claim_slot',{room_code:LB.room,country:c,player:ME});
  if(error)return lbMsg('Ошибка: '+error.message);
  if(!data)return lbMsg(`${CN[c].n} уже занята.`);
  LB.msg='';await lbRefresh();
}

// the host starts the game locally with the room's settings; free countries become bots
async function lbStart(){
  const d=LB.data;if(!d||d.host!==ME)return;
  const queue=(d.queue||[]).includes(ME)?(d.queue||[]):[ME,...(d.queue||[])];
  const {error}=await DB.from('rooms').update({status:'playing',queue,active:queue[0]||'bots',tn:1,deadline:Date.now()+TURN_MS,closed_by:null,missed:{}}).eq('code',LB.room);
  if(error)return lbMsg('Ошибка: '+error.message);
  const slots=d.slots||{};
  const mine=Object.keys(slots).find(k=>slots[k]===ME);
  SCEN=d.SCEN;PLUS=d.PLUS;ZERO=true;FFA=true;PEACE=4;
  rebuildAll();
  SEL={};CKV().forEach(c=>{SEL[c]=0});
  SELPL=mine||'SPEC';
  LB.active=false;
  $('#ov').style.display='none';
  begin();
  S.mpNeutral=true;
  MP={code:LB.room,host:true,tn:1,queue,active:queue[0]||'bots',missed:{},deadline:Date.now()+TURN_MS,busy:false,lastActive:null};
  S.human={};S.humanOwner={};Object.keys(slots).forEach(k=>{S.humanOwner[k]=slots[k];if(slots[k]!==ME)S.human[k]=true});
  await mpPublish();
  startMpLoops();
}


/* ---------- map editor: countries built from the existing provinces ---------- */
// ED.tool: 'yard' | 'fac' | 'del' applies to the next tapped province; ED.capFor: country whose capital is being picked
const ED={sel:new Set(),own:null,countries:[],nextId:1,msg:'',tool:null,capFor:null,detail:null,yard:{},fac:{}};
function editor(){LB.active=false;if(!ED.own)ED.own=P.map(()=>-1);renderEditor()}
function edMsg(t){ED.msg=t;renderEditor()}
const edCountry=id=>ED.countries.find(c=>c.id===id);

    h+=ED.countries.map(c=>`<div class="row"><span style="color:hsl(${c.hue} 60% 60%)">■</span><button class="g" onclick="edDetail(${c.id})">${c.name}</button><span class="mut">${c.provs.length} пров.</span><button class="g z" onclick="edDel(${c.id})">удалить</button></div>`).join('');
    h+=`<h2 style="margin-top:12px">Сценарий</h2><div class="row"><button onclick="edExport()">Экспорт</button><button class="g" onclick="edImport()">Импорт</button></div><textarea id="edt" rows="5" style="width:100%"></textarea><div class="row"><input id="edsn" placeholder="название сценария"><button onclick="edSave()">Сохранить</button></div>`;

// saved scenarios live in the browser (localStorage), listed in the single-player setup
const SCEN_KEY='americas-scenarios';
function scenStore(){try{return JSON.parse(localStorage.getItem(SCEN_KEY)||'[]')}catch(e){return []}}
function scenWrite(l){try{localStorage.setItem(SCEN_KEY,JSON.stringify(l))}catch(e){}}
function scenListHTML(){
  const l=scenStore();
  if(!l.length)return '';
  return `<h2 style="margin-top:10px">Сохранённые сценарии</h2>`+l.map((x,i)=>`<div class="row"><button class="g" onclick="scenOpen(${i})">${x.name}</button><button class="g z" onclick="scenDel(${i})">удалить</button></div>`).join('');
}
function scenOpen(i){const x=scenStore()[i];if(!x)return;editor();edLoadText(x.text)}
function scenDel(i){const l=scenStore();l.splice(i,1);scenWrite(l);setup()}
function edDump(){
  return JSON.stringify({v:2,plus:PLUS,countries:ED.countries.map(c=>({
    name:c.name,hue:c.hue,provs:c.provs,econ:c.econ,start:c.start,aggr:c.aggr,capital:c.capital,
    yards:c.provs.filter(pid=>ED.yard[pid]),facs:c.provs.filter(pid=>ED.fac[pid])
  }))});
}
function edSave(){
  const name=((document.getElementById('edsn')||{}).value||'').trim();
  if(!name)return edMsg('Дай сценарию название.');
  if(!ED.countries.length)return edMsg('Сначала создай хотя бы одну страну.');
  const l=scenStore();l.push({name,text:edDump(),t:Date.now()});scenWrite(l);
  edMsg(`Сценарий «${name}» сохранён.`);
}
function edDetail(id){ED.detail=id;ED.capFor=null;ED.tool=null;renderEditor()}
function edSet(id,k,v){const c=edCountry(id);if(!c)return;c[k]=+v;renderEditor()}
function edCapStart(id){ED.capFor=id;ED.msg='Тапни провинцию этой страны, она станет столицей.';renderEditor()}
function edTool(t){ED.tool=ED.tool===t?null:t;ED.msg='';renderEditor()}
function edPick(e){
  const cv=$('#edc'),r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  const gx=x/CS|0,gy=y/CS|0;
  if(gx<0||gx>=GW||gy<0||gy>=GH)return;
  const pid=cell[gy*GW+gx];
  if(pid<0)return;
  if(ED.capFor!==null){
    const c=edCountry(ED.capFor);
    if(c&&ED.own[pid]===c.id){c.capital=pid;ED.capFor=null;ED.msg='';renderEditor()}
    else{ED.msg='Столица должна быть в провинции этой страны.';renderEditor()}
    return;
  }
  if(ED.tool){applyTool(pid);return}
  if(ED.detail!==null)return;
  if(ED.sel.has(pid))ED.sel.delete(pid);else ED.sel.add(pid);
  renderEditor();
}
function applyTool(pid){
  if(ED.own[pid]<0){ED.msg='Ставь верфь или завод только в провинцию страны.';return renderEditor()}
  if(ED.tool==='yard'){
    if(!isCoast(pid)){ED.msg='Верфь ставится только на побережье.';return renderEditor()}
    if(ED.fac[pid]){ED.msg='Верфь и завод в одном месте нельзя.';return renderEditor()}
    ED.yard[pid]=true;
  }else if(ED.tool==='fac'){
    if(ED.yard[pid]){ED.msg='Верфь и завод в одном месте нельзя.';return renderEditor()}
    ED.fac[pid]=true;
  }else if(ED.tool==='del'){
    delete ED.yard[pid];delete ED.fac[pid];
  }
  ED.msg='';renderEditor();
}
function drawEditor(){
  const cv=$('#edc');if(!cv)return;
  const g=cv.getContext('2d');
  g.setTransform(SS,0,0,SS,0,0);g.fillStyle='#0b1822';g.fillRect(0,0,W,H);
  const cols=P.map((p,pid)=>{
    if(ED.sel.has(pid))return '#f0c35a';
    const c=edCountry(ED.own[pid]);
    return c?`hsl(${c.hue} 45% 40%)`:'#3a4a57';
  });
  for(let i=0;i<cell.length;i++){
    const a=cell[i];
    if(a===-2)g.fillStyle='#1f5f8b';else if(a<0)continue;else g.fillStyle=cols[a];
    g.fillRect((i%GW)*CS,(i/GW|0)*CS,CS,CS);
  }
  g.fillStyle='rgba(5,15,22,.8)';
  for(let i=0;i<cell.length;i++){
    const a=cell[i];if(a<0)continue;
    const x=i%GW,y=i/GW|0;
    if(x<GW-1&&cell[i+1]!==a)g.fillRect((x+1)*CS-1,y*CS,2,CS);
    if(y<GH-1&&cell[i+GW]!==a)g.fillRect(x*CS,(y+1)*CS-1,CS,2);
  }
  // markers: factory = gold square, shipyard = blue square, capital = white square
  P.forEach((p,pid)=>{
    if(ED.fac[pid]){g.fillStyle='#f0c35a';g.fillRect(p.x+4,p.y+4,8,8)}
    if(ED.yard[pid]){g.fillStyle='#8fd3ff';g.fillRect(p.x-12,p.y+4,8,8)}
    const c=edCountry(ED.own[pid]);
    if(c&&c.capital===pid){g.fillStyle='#ffffff';g.fillRect(p.x-4,p.y-12,8,8)}
  });
}
function edCreate(){
  const name=((document.getElementById('edn')||{}).value||'').trim();
  if(!ED.sel.size)return edMsg('Сначала выбери провинции.');
  if(!name)return edMsg('Дай стране название.');
  const id=ED.nextId++;
  ED.countries.push({id,name,hue:(id*67)%360,provs:[],econ:3,start:2,aggr:10,capital:null});
  ED.sel.forEach(pid=>{ED.own[pid]=id});
  ED.sel.clear();
  reindex();
  ED.msg='';renderEditor();
}
// rebuild each country's province list; markers only stay in provinces that still belong to a country
function reindex(){
  ED.countries.forEach(c=>{c.provs=[]});
  P.forEach((p,pid)=>{
    const c=edCountry(ED.own[pid]);
    if(c)c.provs.push(pid);else{delete ED.yard[pid];delete ED.fac[pid]}
  });
  ED.countries=ED.countries.filter(c=>c.provs.length);
  ED.countries.forEach(c=>{if(c.capital!=null&&ED.own[c.capital]!==c.id)c.capital=null});
}
function edDel(id){
  P.forEach((p,pid)=>{if(ED.own[pid]===id){ED.own[pid]=-1;delete ED.yard[pid];delete ED.fac[pid]}});
  ED.countries=ED.countries.filter(c=>c.id!==id);
  if(ED.detail===id)ED.detail=null;
  reindex();renderEditor();
}
function edExport(){
  const d={v:2,plus:PLUS,countries:ED.countries.map(c=>({
    name:c.name,hue:c.hue,provs:c.provs,econ:c.econ,start:c.start,aggr:c.aggr,capital:c.capital,
    yards:c.provs.filter(pid=>ED.yard[pid]),facs:c.provs.filter(pid=>ED.fac[pid])
  }))};
  document.getElementById('edt').value=JSON.stringify(d);
  document.getElementById('edmsg').textContent='Сценарий в поле ниже. Скопируй его.';
}
function edImport(){edLoadText(document.getElementById('edt').value)}
function edLoadText(text){
  try{
    const d=JSON.parse(text);
    if(d.plus!==PLUS)return edMsg('Сценарий сделан для другой карты (Провинции+ не совпадает).');
    ED.own=P.map(()=>-1);ED.yard={};ED.fac={};ED.countries=[];ED.nextId=1;
    d.countries.forEach(c=>{
      const id=ED.nextId++;
      ED.countries.push({id,name:c.name,hue:c.hue,provs:[],econ:c.econ||3,start:c.start??2,aggr:c.aggr??10,capital:c.capital??null});
      c.provs.forEach(pid=>{if(P[pid])ED.own[pid]=id});
      (c.yards||[]).forEach(pid=>{if(P[pid])ED.yard[pid]=true});
      (c.facs||[]).forEach(pid=>{if(P[pid])ED.fac[pid]=true});
    });
    reindex();
    edMsg(`Загружено стран: ${ED.countries.length}.`);
  }catch(e){edMsg('Не удалось прочитать сценарий: '+errText(e))}
}

/* ---------- sound: effects and a simple ambient loop (synthesised, no recordings) ---------- */
let AC=null,SFX_ON=true,MUSIC_ON=true,musicTimer=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}if(AC)musicStart()}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,dur,type,vol,when){
  const a=audio();if(!a||!SFX_ON)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0);
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,vol){
  const a=audio();if(!a||!SFX_ON)return;
  const b=a.createBuffer(1,a.sampleRate*dur|0,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const src=a.createBufferSource(),g=a.createGain();
  src.buffer=b;g.gain.value=vol;src.connect(g);g.connect(a.destination);src.start();
}

  shot:()=>noise(0.12,0.25),

  buy:()=>{tone(660,0.12,'triangle',0.2);tone(880,0.15,'triangle',0.2,0.12)},
  click:()=>tone(1200,0.03,'square',0.05),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,0.3,'triangle',0.25,i*0.15)),
  lose:()=>[392,330,262].forEach((f,i)=>tone(f,0.4,'sawtooth',0.15,i*0.25))
};

/* ---------- anthems: public-domain melodies, transcribed in ABC, played as synthesised tones ---------- */
// Союз: The Star-Spangled Banner (John Stafford Smith, 1775). Конфедерация: Dixie (Daniel Emmett, 1859).
// Великобритания: God Save the King (traditional). All three are in the public domain.
const ANTHEMS={
  UK:{name:'God Save the King',key:'D',L:'1/4',abc:'dde|c>de|ffg|f>ed|edc|d3|aaa|a>gf|ggg|g>fe|fg/f/e/d/|f>ga|(3b/a/g/ fe|d3|'},
  UN:{name:'The Star-Spangled Banner',key:'C',L:'1/8',abc:'GE | C2 E2 G2 | c4 ed | c2 E2 ^F2 | G4 GG | e3 d c2 | B4 AB | c2 c2 G2 | E2 C2 :| ee | e2 f2 g2 | g4 fe | d2 e2 f2 | f4 f2 | e3 d c2 | B4 AB | c2 E2 ^F2 | G4 |] G2 | c2 c2 cB | A2 A2 A2 | d2 fe dc | c2 B2 GG | c3 def | g4 cd | e3 f d2 | c4 |]'},
  CS:{name:'Dixie',key:'C',L:'1/8',abc:'G/E/|CC C/D/E/F/ GGGE|AA A>G A>G A/B/c/d/|e3c/G/ c3 G/E/|G3D/E/ C3:| G|ce dc Ac2A|d3A d3G| ce d>c AB c>A|GE c>E ED2E| C3E D3F|EG c>E ED2E| C3E D3F|EG e>c dc|]'}
};
// turns the ABC text into [frequency, seconds] pairs; the tempo is a quarter note = 110
function abcNotes(t){
  const sharps=t.key==='D'?['f','c']:[];
  const s=t.abc.replace(/"[^"]*"/g,'').replace(/\\/g,' ').replace(/\(3/g,'').replace(/[|:\[\]H.\-]/g,' ');
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const spu=(t.L==='1/8'?0.5:1)*60/110;
  const out=[];let halfNext=false,m;
  const re=/(\^?)([A-Ga-gz])([',]*)(\d*)(\/*)(\d*)(>?)/g;
  while((m=re.exec(s))){
    const sh=m[1],letter=m[2],oct=m[3],num=m[4],sl=m[5],sl2=m[6],gt=m[7];
    let len=num?+num:1;
    if(sl)len*=sl2?1/+sl2:Math.pow(0.5,sl.length);
    if(halfNext){len*=0.5;halfNext=false}
    if(gt){len*=1.5;halfNext=true}
    if(letter==='z'){out.push([0,len*spu]);continue}
    const up=letter===letter.toUpperCase();
    let midi=60+base[letter.toUpperCase()]+(up?0:12);
    midi+=12*(oct.split("'").length-1)-12*(oct.split(',').length-1);
    if(sh||sharps.includes(letter.toLowerCase()))midi+=1;
    out.push([440*Math.pow(2,(midi-69)/12),len*spu]);
  }
  return out;
}
function playAnthem(c){
  const t=ANTHEMS[c];
  if(!t||!SFX_ON||!audio())return;
  let at=0;
  abcNotes(t).forEach(([f,d])=>{if(f>0)tone(f,d*0.9,'triangle',0.16,at);at+=d});
}

async function mpPull(){

  const {data}=await DB.from('rooms').select('state').eq('code',MP.code).maybeSingle();

  restoreSnapshot(data.state);
  S.pl=keepPl;S.spec=keepSpec;S.mpGuest=true;

/* ---------- multiplayer step 2: guests send orders, the host applies them when the turn closes ---------- */
// an order is stored as one row: room, turn, player, orders JSON

// the host checks that the order really comes from the owner of the country and applies it
function applyOrder(o,country){
  if(o.k==='plan'){
    if(S.ctl[o.a]===country&&P[o.a].adj.includes(o.b))S.plans.push({t:o.t,a:o.a,b:o.b,v:o.v});
  }else if(o.k==='rec'){
    if(S.ctl[o.f]!==country||S.G[country]<costOf(country,o.t)||free(o.f)<=0)return;
    S.G[country]-=costOf(country,o.t);S.q[o.f][o.t]++;
  }else if(o.k==='buy'){
    if(zBlocked(o.zid)||S.G[country]<SHIPS[o.t].cost)return;
    if(!P.some(p=>p.yard&&S.ctl[p.id]===country&&yardZones(p).includes(o.zid)))return;
    S.G[country]-=SHIPS[o.t].cost;S.shipQ.push({zid:o.zid,c:country,t:o.t,arrive:S.t+2});
  }else if(o.k==='land'){
    if(S.zf[o.zid]&&S.zf[o.zid].c===country)landing(o.zid,o.b);
  }else if(o.k==='fleet'){
    if(S.zf[o.from]&&S.zf[o.from].c===country)fleetMove(o.from,o.to);
  }
}
// called by the host when the turn closes: takes every order of this turn and runs it
async function collectOrders(){
  if(!MP||!MP.host||!DB)return;
  const {data:rd}=await DB.from('rooms').select('slots').eq('code',MP.code).maybeSingle();
  const slots=(rd&&rd.slots)||{};
  const {data}=await DB.from('orders').select('player,o').eq('room',MP.code).eq('turn',S.t).order('id',{ascending:true});
  (data||[]).forEach(r=>{const c=Object.keys(slots).find(k=>slots[k]===r.player);if(c)applyOrder(r.o,c)});
  if(S.plans.length)execPlans();
  if(data&&data.length)await DB.from('orders').delete().eq('room',MP.code).lte('turn',S.t);
}
// guests do not keep plans locally: they go to the host
function addPlan(p){
  if(MP&&!MP.host){sendOrder(Object.assign({k:'plan'},p));return}
  S.plans.push(p);
}

/* ---------- multiplayer step 3: turn queue, 40-second turns, bots play a round after the players ---------- */
const TURN_MS=40000;
let MP_T=null,MP_F=null;
const nextOf=(q,a)=>{if(a==='bots')return q[0]||'bots';const i=q.indexOf(a);return i+1<q.length?q[i+1]:'bots'};
function mpPublish(){
  if(!MP||!MP.host||!DB)return Promise.resolve();
  return DB.from('rooms').update({state:snapshot()}).eq('code',MP.code);
}
async function mpRead(){
  const {data}=await DB.from('rooms').select('queue,active,tn,deadline,closed_by,missed,slots,state').eq('code',MP.code).maybeSingle();
  return data;
}
async function mpAdvance(tn,next,closedBy,queue,missed){
  const dl=next==='bots'?Date.now():Date.now()+TURN_MS;
  const {data,error}=await DB.from('rooms').update({tn:tn+1,active:next,deadline:dl,closed_by:closedBy,queue,missed}).eq('code',MP.code).eq('tn',tn).select('tn');
  return !error&&!!(data&&data.length);
}
// a player's orders are applied by the host after the player ends the turn
async function applyTurnOrders(tn,player){
  const {data:rd}=await DB.from('rooms').select('slots').eq('code',MP.code).maybeSingle();
  const slots=(rd&&rd.slots)||{};
  const c=Object.keys(slots).find(k=>slots[k]===player);
  const {data}=await DB.from('orders').select('o').eq('room',MP.code).eq('turn',tn).eq('player',player).order('id',{ascending:true});
  if(c){
    const old=S.manual[c];
    S.manual[c]=true;
    (data||[]).forEach(r=>{applyOrder(r.o,c);if(S.plans.length)execPlans()});
    S.manual[c]=old;
  }
  await DB.from('orders').delete().eq('room',MP.code).lte('turn',tn);
}
async function sendOrder(o){
  if(!DB||!MP)return;
  if(MP.active!==ME)return L('Сейчас ходит другой игрок.');
  const {error}=await DB.from('orders').insert({room:MP.code,turn:MP.tn,player:ME,o});
  L(error?'Приказ не отправился: '+error.message:'Приказ отправлен.');
  render();
}
// the active player ends the turn: the next one in the queue starts, a player who is last hands over to the bots
async function mpEndMyTurn(){
  if(!MP||!DB||MP.active!==ME)return;
  const missed=Object.assign({},MP.missed||{});missed[ME]=0;
  if(MP.host){if(S.plans.length)execPlans();await mpPublish()}
  await mpAdvance(MP.tn,nextOf(MP.queue,ME),'player',MP.queue,missed);
}
// host loop: applies the orders of a turn that a player closed, runs the bots, handles timeouts
async function mpHostTick(){
  if(!MP||!MP.host||!DB||MP.busy)return;
  MP.busy=true;
  try{
    await dipPoll();
    await dipApply();
    const d=await mpRead();
    if(!d||!d.queue||!d.queue.length)return;
    if(MP.tn!==d.tn){
      if(MP.lastActive&&MP.lastActive!=='bots'&&d.closed_by==='player')await applyTurnOrders(MP.tn,MP.lastActive);
      MP.tn=d.tn;MP.lastActive=d.active;
      await mpPublish();
    }
    MP.active=d.active;MP.queue=d.queue;MP.missed=d.missed||{};MP.deadline=d.deadline;
    if(d.active==='bots'){
      endTurnCore();
      await mpPublish();
      await mpAdvance(d.tn,nextOf(d.queue,'bots'),'bots',d.queue,d.missed||{});
    }else if(Date.now()>d.deadline){
      const gone=d.active;
      const missed=Object.assign({},d.missed||{});missed[gone]=(missed[gone]||0)+1;
      let queue=d.queue;
      if(missed[gone]>=2&&gone!==ME){
        queue=queue.filter(x=>x!==gone);
        const c=Object.keys(d.slots||{}).find(k=>d.slots[k]===gone);
        if(c&&S.human)S.human[c]=false;
        L(`${gone} пропустил два хода и заменён ботом.`);
      }
      if(gone===ME)S.plans=[];
      await DB.from('orders').delete().eq('room',MP.code).eq('turn',d.tn);
      await mpAdvance(d.tn,nextOf(d.queue,gone),'timeout',queue,missed);
      await mpPublish();
    }
  }finally{MP.busy=false}
}
// guest loop: follows the room, restores the map when a turn was closed
async function mpGuestTick(){
  if(!MP||MP.host||!DB)return;
  await dipPoll();
  const d=await mpRead();
  if(!d)return;
  MP.active=d.active;MP.queue=d.queue;MP.missed=d.missed||{};MP.deadline=d.deadline;
  if(MP.tn!==d.tn){
    MP.tn=d.tn;
    if(d.state){const keepPl=S.pl,keepSpec=S.spec;SELPL=keepPl;restoreSnapshot(d.state);S.pl=keepPl;S.spec=keepSpec;S.mpGuest=true}
  }
  renderFab();
}
function startMpLoops(){
  if(MP_T)clearInterval(MP_T);
  if(MP_F)clearInterval(MP_F);
  MP_T=setInterval(()=>{if(MP&&MP.host)mpHostTick();else if(MP)mpGuestTick()},2000);
  MP_F=setInterval(()=>{if(MP&&MP.active)renderFab()},1000);
}

let DIPIN=[];
const isHumanTarget=c=>!!(MP&&S.humanOwner&&S.humanOwner[c]&&S.humanOwner[c]!==ME);
async function dipRequest(kind,c,months){
  const owner=S.humanOwner&&S.humanOwner[c];
  if(!owner||!DB||!MP)return;
  const {error}=await DB.from('orders').insert({room:MP.code,turn:MP.tn,player:owner,o:{k:'dipl',kind,from:S.pl,to:c,months:months||0,fromPlayer:ME}});
  L(error?'Не отправилось: '+error.message:`Предложение отправлено игроку (${CN[c].n}).`);
  render();
}
async function dipPoll(){
  if(!MP||!DB)return;
  const {data}=await DB.from('orders').select('id,o').eq('room',MP.code).eq('player',ME).contains('o',{k:'dipl'});
  let changed=false;
  (data||[]).forEach(r=>{if(!DIPIN.some(x=>x.id===r.id)){DIPIN.push(Object.assign({id:r.id},r.o));changed=true}});
  const {data:res}=await DB.from('orders').select('id,o').eq('room',MP.code).eq('player',ME).contains('o',{k:'dipl_res'});
  (res||[]).forEach(r=>{L(r.o.ok?'Твоё предложение приняли.':'Твоё предложение отклонили.');DB.from('orders').delete().eq('id',r.id).then(()=>{})});
  if(changed||(res&&res.length))render();
}
async function dipAnswer(ok){
  const r=DIPIN.shift();if(!r||!DB)return;
  await DB.from('orders').delete().eq('id',r.id);
  if(ok)await DB.from('orders').insert({room:MP.code,turn:MP.tn,player:ME,o:{k:'dipl_ans',kind:r.kind,from:r.from,to:r.to,months:r.months}});
  if(r.fromPlayer)await DB.from('orders').insert({room:MP.code,turn:MP.tn,player:r.fromPlayer,o:{k:'dipl_res',ok,kind:r.kind,to:r.to}});
  L(ok?'Ты согласился.':'Ты отказал.');
  render();
}
function dipBanner(){
  if(!DIPIN.length)return '';
  const r=DIPIN[0];
  const what={peace:'мир',truce:`перемирие на ${r.months} мес.`,ally:'союз'}[r.kind]||r.kind;
  return `<div class="row"><b>${CN[r.from]?CN[r.from].n:r.from} предлагает ${what}.</b></div><div class="row"><button onclick="dipAnswer(true)">Согласиться</button><button class="g" onclick="dipAnswer(false)">Отказ</button></div>`;
}
// the host applies the answers: relations change in the game state
async function dipApply(){
  if(!MP||!MP.host||!DB)return;
  const {data}=await DB.from('orders').select('id,o').eq('room',MP.code).contains('o',{k:'dipl_ans'});
  if(!data||!data.length)return;
  data.forEach(r=>{
    const o=r.o,key=pairKey(o.from,o.to);
    if(o.kind==='peace'){S.rel[key]='peace';delete S.truceEnd[key]}
    else if(o.kind==='truce'){S.rel[key]='truce';S.truceEnd[key]=S.t+(o.months||3)}
    else if(o.kind==='ally'){allyUp(o.from,o.to)}
  });
  await DB.from('orders').delete().in('id',data.map(r=>r.id));
  await mpPublish();
}

/* ---------- bots and the navy ---------- */
// a bot land landing: the same 5 elite as the player's, same cooldowns, aggressive countries only
function botLand(c,z){
  const f=S.zf[z];if(!f||f.c!==c)return;
  if(f.n[0]+f.n[2]===0||aggOf(c)<15)return;
  const need=f.n[2]>0?2:3;
  if(S.t-(S.landT[z]===undefined?-99:S.landT[z])<need)return;
  const cands=zoneLands(z).filter(b=>S.ctl[b]!==null&&S.ctl[b]!==c&&rel(c,S.ctl[b])==='war');
  if(!cands.length)return;
  const b=cands.sort((x,y)=>pw(S.u[x])-pw(S.u[y]))[0];
  S.landT[z]=S.t;
  const sum=[0,5,0,0],d=S.u[b];
  if(!tot(d)){cap(b,c,sum);check();return}
  const A=pw(sum)*(.8+Math.random()*.4),D=pw(d)*1.25*(.8+Math.random()*.4);
  if(Math.abs(A-D)<=0.1*Math.max(A,D)){S.u[b]=Z();check();return}
  if(A>D){S.u[b]=Z();cap(b,c,[0,Math.max(1,Math.round(5*(1-(D/A)**2))),0,0])}
  else S.u[b]=d.map(x=>Math.round(x*Math.max(.15,1-(A/D)**2)));
  check();
}
// buy ships at yards, keep the fleet on the coast; aggressive fleets attack weaker enemy fleets and land troops
function botNaval(c){
  const agg=aggOf(c);
  const yz=[...new Set(P.filter(p=>p.yard&&S.ctl[p.id]===c).flatMap(p=>yardZones(p)))]
    .filter(z=>{const f=S.zf[z];return(!f||f.c===c)&&zTot(f)<11});
  if(yz.length&&Math.random()<0.2+agg/60){
    // aggressors buy cruisers and destroyers for landings; passive countries buy submarines to guard the coast
    const t=agg>=15?(S.G[c]>=445?2:(S.G[c]>=120?0:-1)):(S.G[c]>=250?1:-1);
    if(t>=0){
      S.G[c]-=SHIPS[t].cost;
      S.shipQ.push({zid:yz[Math.random()*yz.length|0],c,t,arrive:S.t+2});
    }
  }
  Object.keys(S.zf).map(Number).forEach(z=>{
    const f=S.zf[z];
    if(!f||f.c!==c||S.fmv[z]===S.t)return;
    botLand(c,z);
    const foes=SEAZ[z].adj.filter(b=>{const g=S.zf[b];return g&&g.c!==c&&rel(c,g.c)==='war'});
    if(!foes.length){if(agg>=15)botPush(c,z,f);return}
    const b=foes.sort((x,y)=>shipDef(S.zf[x].n)-shipDef(S.zf[y].n))[0];
    const g=S.zf[b];
    if(shipAtk(f.n)>shipDef(g.n)*(1.1+(30-agg)/60)){
      if(isMy(g.c))L(`${CN[c].n} топит ваши корабли в «${SEAZ[b].name}».`);
      S.zf[b]={c,n:f.n.slice()};delete S.zf[z];S.fmv[b]=S.t;
    }
  });
}

/* ---------- bots and turn ---------- */
// enemy divisions next to province i (what its owner sees on its border)
function nearOf(i){
  const c=S.ctl[i];if(c===null||c===undefined)return 0;
  const tm=S.team[c];
  return P[i].adj.reduce((t,b)=>t+((S.ctl[b]!==null&&rel(c,S.ctl[b])==='war')?tot(S.u[b]):0),0);
}
function bot(c){
  const tm=S.team[c];
  const isEn=b=>S.ctl[b]!==null&&rel(c,S.ctl[b])==='war';
  // passive and poor countries guard their coasts instead of the border
  const passiveCoast=aggOf(c)<15&&S.G[c]<150;
  const front=b=>passiveCoast?isCoast(b):P[b].adj.some(isEn);
  const mineP=P.filter(p=>S.ctl[p.id]===c).map(p=>p.id);
  const peace=S.t<PEACE;
  const grow=i=>nearOf(i)-(S.prevNear[i]||0);
  let fort=false;
  // recruit: front provinces first, the ones where enemy numbers grew most; spend the whole treasury
  for(let k=0;k<40&&!S.over;k++){
    const aff=[0,1,2,3].filter(t=>CT[t]<=S.G[c]);if(!aff.length)break;
    const f=mineP.filter(i=>free(i)>0&&P[i].fac);if(!f.length)break;
    const fr=f.filter(front);
    let pool;
    if(fr.length){pool=fr.sort((x,y)=>((grow(y)-grow(x))||(nearOf(y)-nearOf(x))));fort=true}
    else pool=f.sort((x,y)=>str(x)-str(y));
    const w=aff.flatMap(t=>Array(4-t).fill(t)),t=w[Math.random()*w.length|0];
    S.q[pool[0]][t]++;S.G[c]-=CT[t];
  }
  if(peace&&fort&&S.team[c]===S.team[S.pl])L(`${CN[c].n} укрепляет границы.`);
  // move reinforcements from the interior toward the front (works in peace too)
  const dist={},qu=mineP.filter(front);qu.forEach(i=>dist[i]=0);
  for(let k=0;k<qu.length;k++)P[qu[k]].adj.forEach(b=>{if(S.ctl[b]===c&&dist[b]===undefined){dist[b]=dist[qu[k]]+1;qu.push(b)}});
  mineP.sort(()=>Math.random()-.5);
  for(const a of mineP){
    if(S.over)break;
    if(S.ctl[a]!==c)continue;
    const v=movv(a);if(!tot(v))continue;
    const en=peace?[]:P[a].adj.filter(isEn).sort((x,y)=>pw(S.u[x])-pw(S.u[y]));
    if(en.length){
      const b=en[0],ag=aggOf(c);
      if(ag>0){
        const w=v.slice();if(ag<20&&tot(w)>1){const t=w.findIndex(x=>x>0);w[t]--}
        const ratio=1.8-(ag/30)*1.3;
        if(!tot(S.u[b])||pw(w)>=pw(S.u[b])*ratio)go(b,[{a,v:w}]);
      }
      continue;
    }
    if(dist[a]===undefined)continue;
    const nx=P[a].adj.filter(b=>S.ctl[b]===c&&dist[b]!==undefined&&dist[b]<dist[a])[0];
    if(nx!==undefined){const w=clampRoom(v,free(nx));if(tot(w))go(nx,[{a,v:w}])}
  }
}

function endTurnCore(){
  if(S.over||S.pending.length||S.plans.length)return;
  P.forEach(p=>{if(S.reb[p.id]>0&&isMy(S.ctl[p.id]))partisans(p.id)});
  P.forEach(p=>{if(S.reb[p.id]&&!isMy(S.ctl[p.id]))S.reb[p.id]=0});
  CK.filter(c=>S.act[c]&&(!S.out[c]||S.master[c]!==undefined)&&!isMy(c)&&!isHuman(c))
    .sort(()=>Math.random()-.5).forEach(c=>{if(!S.over&&(!S.out[c]||S.master[c]!==undefined)){bot(c);botNaval(c);botDiplo(c)}});
  betrayals();
  check();
  if(!S.over){
    P.forEach(p=>{const i=p.id;S.u[i]=S.u[i].map((x,t)=>x+S.q[i][t]);S.q[i]=Z();S.m[i]=Z()});
    // mobilisation: a division appears in every factory province each turn
    CK.forEach(c=>{
      if(!S.act[c]||(S.out[c]&&S.master[c]===undefined)||!S.mob[c])return;
      P.forEach(p=>{if(!(p.fac&&S.ctl[p.id]===c))return;(econOf(c)==='plan'?[0,0,0,1]:[0,0,1]).forEach(t=>{if(free(p.id)>0&&mobPct(c)<mobCap(c)){S.u[p.id][t]++;S.mobN[c]=(S.mobN[c]||0)+1}})});
      if(mobPct(c)>=mobCap(c)&&!S.mobOut[c]){S.mobOut[c]=true;L(`${CN[c].n}: население исчерпано, мобилизация недоступна.`)}
    });
    if(S.t>=PEACE)P.forEach(p=>{const r=rate(p.id);if(r&&!S.reb[p.id]&&!strong(p.id)&&Math.random()*100<r){S.reb[p.id]=2;L(`Восстание в «${p.name}»!`)}});
    CK.forEach(c=>{
      if(!S.act[c]||(S.out[c]&&S.master[c]===undefined))return;
      const I=incomeOf(c);
      if(S.master[c]!==undefined){const a=Math.round(I*S.share[c]/100);S.G[S.master[c]]+=a;S.G[c]+=I-a}
      else S.G[c]+=I;
    });
    S.t++;
    Object.keys(S.rep).forEach(c=>{
      const r=S.rep[c],pay=Math.min(r.amt,Math.max(0,S.G[c]||0));
      S.G[c]-=pay;S.G[S.pl]+=pay;
      if(pay>0)L(`${CN[c].n} платит репарации: ${pay}.`);
      r.left--;if(r.left<=0)delete S.rep[c];
    });
    S.shipQ=S.shipQ.filter(q=>{
      if(q.arrive>S.t)return true;
      const f=S.zf[q.zid];
      if((!f||f.c===q.c)&&zTot(f)<12){const n=f?f.n.slice():[0,0,0];n[q.t]++;S.zf[q.zid]={c:q.c,n}}
      else{S.G[q.c]+=SHIPS[q.t].cost;L(`Корабль не смог встать в «${SEAZ[q.zid].name}»: деньги возвращены.`)}
      return false;
    });
    if(INFMONEY&&!S.spec)S.G[S.pl]=Math.max(S.G[S.pl],99999);
    expireTruces();
    if(S.t===PEACE){
      CK.forEach(c=>{if(S.act[c]&&!S.out[c]&&c!==S.pl)S.mob[c]=true});
      L('Война началась! Союзники и враги объявили всеобщую мобилизацию.');
      playAnthem(S.pl);
    }
    S.prevNear=P.map((p,i)=>nearOf(i));
  }
  render();
}

async function endTurn(){
  if(MP){mpEndMyTurn();return}
  if(S.over)return;
  if(S.pending.length){L('Сначала реши судьбу капитулировавшей страны.');render();return}
  if(S.events&&S.events.length){L('Сначала ответь на предложение союза.');render();return}
  if(S.plans.length){L('Сначала выполни («!») или очисти («X») приказы.');render();return}
  try{endTurnCore();S.szHist=(S.szHist||[]).concat(JSON.stringify(snapshot()).length);mpPublish()}
  catch(e){L('Ошибка хода: '+e.message);console.error(e);render()}
}

/* ---------- orders ---------- */
// one click on a target creates plans from every selected source next to it
function makePlans(b){
  const hostile=!isMy(S.ctl[b]);
  if(hostile&&S.t<PEACE){L('Пока мир: атаковать нельзя.');S.grp=[];S.cnt={};return}
  const srcs=S.grp.filter(s=>P[s].adj.includes(b)&&isMy(S.ctl[s]));
  let room=hostile?12-S.plans.filter(q=>q.t==='a'&&q.b===b).reduce((x,q)=>x+tot(q.v),0):Infinity;
  let made=0;
  srcs.forEach(a=>{
    const av=avail(a);
    let v=(S.cnt[a]||av).map((x,t)=>Math.max(0,Math.min(x,av[t])));
    if(hostile){v=clampRoom(v,room);room-=tot(v)}
    if(!tot(v))return;
    addPlan({t:hostile?'a':'m',a,b,v});made++;
  });
  if(!made)L('Нет войск для приказа.');
  S.grp=[];S.cnt={};
}
function clearPlans(){S.plans=[];render()}
function delPlan(i){S.plans.splice(i,1);render()}
function execPlans(){
  if(S.over)return;
  const plans=S.plans;S.plans=[];
  const done=new Set();
  for(const q of plans){
    if(S.over)break;
    if(!isMy(S.ctl[q.a]))continue;
    if(q.t==='m'){
      const m=movv(q.a),v=q.v.map((x,t)=>Math.max(0,Math.min(x,m[t])));
      if(tot(v)&&P[q.a].adj.includes(q.b))go(q.b,[{a:q.a,v}]);
    }else{
      if(S.t<PEACE||done.has(q.b))continue;
      done.add(q.b);
      const pieces=plans.filter(x=>x.t==='a'&&x.b===q.b&&isMy(S.ctl[x.a])&&P[x.a].adj.includes(q.b))
        .map(x=>{const m=movv(x.a);return{a:x.a,v:x.v.map((y,t)=>Math.max(0,Math.min(y,m[t])))}})
        .filter(p=>tot(p.v)>0);
      if(pieces.length)go(q.b,pieces);
    }
  }
  S.grp=[];S.cnt={};
  render();
}

function pick(e){
  audio();
  if(!S||S.over||S.pending.length||(S.events&&S.events.length)||S.screen==='puppets'||S.screen==='victory'||S.screen==='diplo'||S.screen==='state')return;
  const r=$('#cv').getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  const gx=x/CS|0,gy=y/CS|0;
  const id=(gx<0||gx>=GW||gy<0||gy>=GH)?-1:cell[gy*GW+gx];
  if(gx>=0&&gx<GW&&gy>=0&&gy<GH&&cell[gy*GW+gx]===-1&&SEA[gy*GW+gx]>=0){seaClick(SEA[gy*GW+gx]);return}
  S.fsel=null;
  if(id<0){S.grp=[];S.cnt={};S.focus=null;render();return}
  const ct=S.ctl[id];
  const adjG=S.grp.some(s=>P[s].adj.includes(id));
  if(isMy(ct)){
    if(S.grp.includes(id)){S.grp=S.grp.filter(s=>s!==id);delete S.cnt[id];S.focus=id}
    else if(S.mode==='tgt'&&adjG){S.focus=id;makePlans(id)}
    else if(tot(avail(id))>0){S.grp.push(id);S.cnt[id]=avail(id);S.focus=id}
    else S.focus=id;
  }else if(ct!==null&&rel(S.pl,ct)!=='war'){
    S.focus=id;
  }else if(adjG){
    S.focus=id;makePlans(id);
  }else{
    S.focus=S.focus===id?null:id;
  }
  render();
}
function setCnt(s,t,el){

function dlgSet(id,r){S.pending[0].asg[id]=r;render()}

function dlgDone(){
  const e=S.pending.shift(),c=e.c,left=[];

  if(e.redist){/* leftovers stay with the puppet */}

}

  });
  h+=`<div class="row"><button class="g" onclick="S.screen='main';render()">Назад</button></div>`;
